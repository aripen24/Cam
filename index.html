<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBSCam - Mobile Broadcaster</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-4">

    <!-- Header Section -->
    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-video text-blue-500 text-base"></i>
            <div>
                <h1 class="font-bold text-sm tracking-wide leading-tight">OBSCam Mobile</h1>
                <p id="roomDisplay" class="text-[10px] text-blue-400 font-mono">Room: Connecting...</p>
            </div>
        </div>
        <!-- Select Active Camera Channel -->
        <select id="camChannel" onchange="switchCamChannel()" class="bg-slate-800 text-slate-200 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 outline-none focus:border-blue-500 cursor-pointer font-medium">
            <option value="1">Cam 1</option>
            <option value="2">Cam 2</option>
            <option value="3">Cam 3</option>
            <option value="4">Cam 4</option>
        </select>
    </div>

    <!-- Main Camera Viewport -->
    <div class="relative w-full aspect-[9/16] sm:aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 my-3 shadow-2xl flex items-center justify-center">
        <!-- Live Video Element -->
        <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        
        <!-- Offline / Loading Placeholder -->
        <div id="videoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 space-y-2">
            <i class="fa-solid fa-camera-rotate text-3xl animate-spin text-blue-500"></i>
            <span class="text-xs font-medium">กำลังเตรียมพร้อมระบบกล้อง...</span>
        </div>

        <!-- Live Status Overlay -->
        <div class="absolute top-3 left-3 flex items-center space-x-2 bg-slate-950/70 backdrop-blur-md px-2.5 py-1 rounded-full border border-slate-800">
            <span id="liveDot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
            <span id="statusText" class="text-[10px] font-semibold text-rose-400 uppercase tracking-wider">OFFLINE</span>
        </div>
    </div>

    <!-- Camera Controls & Actions -->
    <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <button id="btnStart" onclick="startStreaming()" class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg transition active:scale-95">
                <i class="fa-solid fa-play"></i>
                <span>เริ่มส่งภาพสด</span>
            </button>
            <button onclick="flipCamera()" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium py-3 px-4 rounded-xl transition active:scale-95">
                <i class="fa-solid fa-camera-rotate"></i>
                <span>สลับกล้อง</span>
            </button>
        </div>

        <!-- Connection Log -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 text-[10px] text-slate-400 font-mono space-y-1">
            <div class="flex justify-between">
                <span>Signaling:</span>
                <span id="sigStatus" class="text-amber-400">Disconnected</span>
            </div>
            <div class="flex justify-between">
                <span>Peer Connection:</span>
                <span id="peerStatus" class="text-slate-500">Idle</span>
            </div>
        </div>
    </div>

    <!-- WebRTC & Firebase Logic -->
    <script>
        // --- 1. Firebase Configuration (ใส่ Config ของคุณตรงนี้) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. Global Variables ---
        let localStream = null;
        let peerConnection = null;
        let currentFacingMode = "environment"; // กล้องหลังเป็นค่าเริ่มต้น
        let activeCamIndex = "1";
        let roomId = "";

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19020' },
                { urls: 'stun:stun1.l.google.com:19020' }
            ]
        };

        // --- 3. Get Room ID from URL Query ---
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            roomId = urlParams.get('room');

            if (!roomId) {
                alert("ไม่พบ Room ID! กรุณาสแกน QR Code ใหม่อีกครั้ง");
                document.getElementById('roomDisplay').innerText = "Room: Error (No ID)";
                return;
            }

            document.getElementById('roomDisplay').innerText = `Room: #${roomId}`;
            document.getElementById('sigStatus').innerText = "Ready";
            document.getElementById('sigStatus').className = "text-emerald-400";

            // เปิดกล้องไว้รอเริ่มต้น
            await initCamera();
        };

        // --- 4. Initialize Local Camera ---
        async function initCamera() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    },
                    audio: true
                });

                const videoElem = document.getElementById('localVideo');
                videoElem.srcObject = localStream;
                document.getElementById('videoPlaceholder').classList.add('hidden');
            } catch (err) {
                console.error("Camera Error:", err);
                alert("ไม่สามารถเข้าถึงกล้อง/ไมโครโฟนได้: " + err.message);
            }
        }

        // --- 5. Start WebRTC Streaming (Create Offer) ---
        async function startStreaming() {
            if (!localStream) {
                await initCamera();
            }

            activeCamIndex = document.getElementById('camChannel').value;
            const signalRef = db.ref(`rooms/${roomId}/cam_${activeCamIndex}`);

            // ล้างข้อมูลสัญญาณเก่า
            await signalRef.remove();

            peerConnection = new RTCPeerConnection(rtcConfig);

            // เพิ่ม Track ภาพ/เสียง เข้า PeerConnection
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // ส่ง ICE Candidates ไปที่ Firebase
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    signalRef.child('offerCandidates').push(event.candidate.toJSON());
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection.iceConnectionState;
                document.getElementById('peerStatus').innerText = state;

                if (state === 'connected') {
                    document.getElementById('statusText').innerText = "LIVE STREAMING";
                    document.getElementById('statusText').className = "text-[10px] font-semibold text-emerald-400 uppercase tracking-wider";
                    document.getElementById('liveDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                }
            };

            // สร้าง Offer (SDP)
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // บันทึก Offer ลง Firebase
            await signalRef.child('offer').set({
                type: offer.type,
                sdp: offer.sdp
            });

            // ฟัง Answer ตอบกลับมาจาก OBS Control Center
            signalRef.child('answer').on('value', async (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection && !peerConnection.currentRemoteDescription) {
                    const answerSDP = new RTCSessionDescription(data);
                    await peerConnection.setRemoteDescription(answerSDP);
                }
            });

            // ฟัง Answer Candidates
            signalRef.child('answerCandidates').on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data));
                }
            });

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStart').classList.add('opacity-50');
            document.getElementById('btnStart').innerText = "กำลังเชื่อมต่อ...";
        }

        // --- 6. Helper Functions ---
        async function flipCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            await initCamera();

            // หากเชื่อมต่ออยู่แล้ว ให้เปลี่ยน Track บน PeerConnection
            if (peerConnection) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(videoTrack);
                }
            }
        }

        function switchCamChannel() {
            if (peerConnection) {
                alert("มีการเปลี่ยน Channel กรุณากด 'เริ่มส่งภาพสด' ใหม่อีกครั้ง");
                peerConnection.close();
                peerConnection = null;
                document.getElementById('btnStart').disabled = false;
                document.getElementById('btnStart').classList.remove('opacity-50');
                document.getElementById('btnStart').innerHTML = `<i class="fa-solid fa-play"></i><span>เริ่มส่งภาพสด</span>`;
                document.getElementById('statusText').innerText = "OFFLINE";
                document.getElementById('statusText').className = "text-[10px] font-semibold text-rose-400 uppercase tracking-wider";
                document.getElementById('liveDot').className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
            }
        }
    </script>
</body>
</html>
