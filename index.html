<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Pro Mobile Camera Sender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Video element หลักสำหรับพรีวิว และรับ Stream Direct */
        #local-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }

        /* iframe VDO.Ninja ซ่อนฉากหลังไว้ส่งสัญญาณอย่างเดียว */
        #ninja-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Overlay แถบบน */
        .overlay {
            position: relative;
            z-index: 10;
            padding: 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4444;
        }
        .dot.active {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }

        /* แถบปรับ Zoom บนหน้าจอหลัก (ด้านขวา) */
        .zoom-overlay {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 16px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            gap: 12px;
        }
        .zoom-slider-vertical {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 160px;
            accent-color: #00f59b;
            cursor: pointer;
        }
        .zoom-label {
            font-size: 11px;
            font-weight: bold;
            color: #00f59b;
        }

        /* แถบควบคุมด้านล่าง */
        .controls-bottom {
            position: relative;
            z-index: 10;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }
        .btn-action.active-state {
            background: rgba(0, 245, 155, 0.4);
            border-color: #00f59b;
        }

        /* แผงเมนูตั้งค่ากล้อง (Settings Drawer) */
        .settings-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 85vh;
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
            z-index: 20;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .settings-panel.open {
            transform: translateY(0);
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .settings-header h3 {
            margin: 0;
            font-size: 18px;
            color: #00f59b;
        }
        .btn-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 16px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .setting-control select, .setting-control input[type="range"] {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .setting-control select option {
            background: #222;
            color: #fff;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-value {
            font-size: 12px;
            color: #00f59b;
            min-width: 55px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบ Overlay ด้านบน -->
        <div class="overlay">
            <div class="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">กำลังเตรียมการ...</span>
            </div>
            <div class="status-badge" id="stream-id-display">ID: ---</div>
        </div>

        <!-- หน้าจอพรีวิวภาพจริงจาก Native MediaStream -->
        <video id="local-video" autoplay playsinline muted></video>

        <!-- iframe VDO.Ninja Engine -->
        <iframe id="ninja-iframe" allow="camera; microphone; autoplay; display-capture"></iframe>

        <!-- หลอดซูมบนหน้าจอหลัก (ด้านขวา) -->
        <div class="zoom-overlay">
            <span class="zoom-label" id="main-zoom-val">1.0x</span>
            <input type="range" class="zoom-slider-vertical" id="main-zoom-slider" min="1" max="5" step="0.1" value="1" oninput="applyHardwareZoom(this.value)">
            <span style="font-size: 12px;">🔍</span>
        </div>

        <!-- แถบปุ่มควบคุมด้านล่าง -->
        <div class="controls-bottom">
            <button class="btn-action" onclick="switchCameraQuick()" title="สลับกล้อง">🔄</button>
            <button class="btn-action" onclick="toggleMute()" id="mute-btn" title="เปิด/ปิด ไมค์">🎙️</button>
            <button class="btn-action" onclick="toggleTorch()" id="torch-btn" title="เปิด/ปิด ไฟฉาย">🔦</button>
            <button class="btn-action" onclick="toggleMirror()" id="mirror-btn" title="กลับด้านภาพ">🪞</button>
            <button class="btn-action" onclick="toggleSettings()" title="ตั้งค่ากล้อง">⚙️</button>
        </div>

        <!-- แผงเมนูตั้งค่ากล้อง & Bitrate (Settings Drawer) -->
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>⚙️ ตั้งค่ากล้อง & การเชื่อมต่อ</h3>
                <button class="btn-close" onclick="toggleSettings()">✖</button>
            </div>

            <!-- เลือกกล้อง (รองรับเลนส์ Ultra-wide, Wide, Telephoto) -->
            <div class="setting-group">
                <label>เลือกอุปกรณ์กล้อง (Camera Source)</label>
                <div class="setting-control">
                    <select id="camera-select" onchange="selectHardwareCamera(this.value)">
                        <option value="">กำลังโหลดรายการกล้อง...</option>
                    </select>
                </div>
            </div>

            <!-- เลือกโหมดการเชื่อมต่อ (Connection Mode) -->
            <div class="setting-group">
                <label>โหมดการเชื่อมต่อ (Connection Mode)</label>
                <div class="setting-control">
                    <select id="connection-mode-select" onchange="changeConnectionMode(this.value)">
                        <option value="0">🔌 USB Mode (บิตเรตสูงสุด / ดีเลย์ต่ำสุด)</option>
                        <option value="1">📶 Wi-Fi Mode (เสถียร / สมดุล)</option>
                        <option value="2">📡 4G/5G Mode (ประหยัดอินเทอร์เน็ต)</option>
                        <option value="custom">⚙️ Custom Mode (ตั้งค่ากำหนดเอง)</option>
                    </select>
                </div>
            </div>

            <!-- ปรับเลือก Bitrate -->
            <div class="setting-group">
                <label>อัตราบิตเรต (Bitrate Selection)</label>
                <div class="setting-control">
                    <select id="bitrate-select" onchange="changeBitratePreset(this.value)">
                        <option value="auto">ตามโหมดการเชื่อมต่อ</option>
                        <option value="1000">1,000 kbps (1 Mbps - ประหยัดเน็ต)</option>
                        <option value="2500">2,500 kbps (2.5 Mbps - เน็ตมือถือ)</option>
                        <option value="3500">3,500 kbps (3.5 Mbps - Wi-Fi ทั่วไป)</option>
                        <option value="6000">6,000 kbps (6 Mbps - USB / Wi-Fi แรง)</option>
                        <option value="10000">10,000 kbps (10 Mbps - USB High Quality)</option>
                        <option value="15000">15,000 kbps (15 Mbps - Ultra HD)</option>
                        <option value="custom">กำหนดเอง (Manual Slider)</option>
                    </select>
                </div>
            </div>

            <!-- Slider ปรับ Bitrate แบบกำหนดเอง -->
            <div class="setting-group" id="custom-bitrate-group">
                <label>ปรับ Bitrate แบบละเอียด (kbps)</label>
                <div class="setting-control slider-container">
                    <input type="range" id="bitrate-slider" min="500" max="20000" step="500" value="3500" oninput="updateBitrateSliderLabel(this.value)" onchange="changeBitrateValue(this.value)">
                    <span class="slider-value" id="bitrate-val">3,500 k</span>
                </div>
            </div>

            <!-- เลือกไมโครโฟน -->
            <div class="setting-group">
                <label>เลือกไมโครโฟน (Audio Source)</label>
                <div class="setting-control">
                    <select id="mic-select" onchange="selectHardwareMic(this.value)">
                        <option value="">กำลังโหลดรายการไมค์...</option>
                    </select>
                </div>
            </div>

            <!-- ปรับความละเอียดวิดีโอ -->
            <div class="setting-group">
                <label>ความละเอียดวิดีโอ (Resolution)</label>
                <div class="setting-control">
                    <select id="res-select" onchange="changeResolution(this.value)">
                        <option value="default">อัตโนมัติ (Default)</option>
                        <option value="3840x2160">4K Ultra HD</option>
                        <option value="1920x1080">1080p Full HD</option>
                        <option value="1280x720">720p HD</option>
                        <option value="640x480">480p SD</option>
                    </select>
                </div>
            </div>

            <!-- ปรับ Framerate -->
            <div class="setting-group">
                <label>เฟรมเรตสูงสุด (Max FPS)</label>
                <div class="setting-control">
                    <select id="fps-select" onchange="changeFPS(this.value)">
                        <option value="60">60 FPS</option>
                        <option value="30">30 FPS</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStream = null;
        let videoTrack = null;
        let videoDevicesList = [];
        let currentCamIndex = 0;

        let isMuted = false;
        let isTorchOn = false;
        let isMirrored = false;

        const videoElement = document.getElementById('local-video');
        const iframe = document.getElementById('ninja-iframe');

        // ดึง URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const pushId = urlParams.get('push');
        const initialQuality = urlParams.get('quality') || '0';

        document.getElementById('stream-id-display').innerText = `ID: ${pushId || 'Unknown'}`;

        function getQualitySettings(q) {
            if (q === '0') {
                return { label: '🔌 USB Mode', bitrate: 6000, maxfps: 60, res: '1920x1080' };
            } else if (q === '1') {
                return { label: '📶 Wi-Fi Mode', bitrate: 3500, maxfps: 30, res: '1280x720' };
            } else {
                return { label: '📡 4G/5G Mode', bitrate: 1500, maxfps: 30, res: '1280x720' };
            }
        }

        let currentQualitySettings = getQualitySettings(initialQuality);

        // ดึง Stream กล้องตรงจาก Native WebRTC
        async function startNativeCamera(deviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' },
                audio: true
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                videoTrack = currentStream.getVideoTracks()[0];

                // ตรวจสอบและตั้งค่า Hardware Zoom
                setupZoomCapability(videoTrack);

                // โหลดอุปกรณ์ทั้งหมดลง Select Dropdown
                await listHardwareDevices();

                // อัปเดต Select ให้ตรงกับตัวที่ใช้อยู่
                if (videoTrack) {
                    const settings = videoTrack.getSettings();
                    if (settings.deviceId) {
                        document.getElementById('camera-select').value = settings.deviceId;
                    }
                }

                // ส่งสัญญาณ VDO.Ninja เมื่อพร้อม
                initNinjaIframe();

            } catch (err) {
                console.error("Camera access error:", err);
                alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตสิทธิ์การใช้กล้อง");
            }
        }

        // จัดการเรื่อง Zoom Capabilities ตรงเข้า Hardware
        function setupZoomCapability(track) {
            if (!track) return;
            
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            const zoomSlider = document.getElementById('main-zoom-slider');

            if ('zoom' in capabilities) {
                zoomSlider.min = capabilities.zoom.min;
                zoomSlider.max = capabilities.zoom.max;
                zoomSlider.step = capabilities.zoom.step || 0.1;
                zoomSlider.value = capabilities.zoom.min;
                document.getElementById('main-zoom-val').innerText = `${zoomSlider.value}x`;
                zoomSlider.disabled = false;
            } else {
                // หากฮาร์ดแวร์ไม่รองรับการซูมแบบ Native
                zoomSlider.disabled = false; // เปิดให้ใช้ Digital Scale ซูมแทน
            }
        }

        // ปรับซูมเข้ากล้องตรงๆ
        async function applyHardwareZoom(val) {
            document.getElementById('main-zoom-val').innerText = `${parseFloat(val).toFixed(1)}x`;

            if (videoTrack) {
                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

                if ('zoom' in capabilities) {
                    try {
                        await videoTrack.applyConstraints({
                            advanced: [{ zoom: parseFloat(val) }]
                        });
                    } catch (e) {
                        console.warn("Hardware zoom error, fallback to transform:", e);
                        videoElement.style.transform = `scale(${val})`;
                    }
                } else {
                    // Digital Zoom Fallback
                    videoElement.style.transform = `scale(${val})`;
                }
            }
        }

        // ดึงรายการกล้องทุกตัวบนมือถือ (Ultra-wide, Main, Telephoto)
        async function listHardwareDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameraSelect = document.getElementById('camera-select');
            const micSelect = document.getElementById('mic-select');

            cameraSelect.innerHTML = '';
            micSelect.innerHTML = '';
            videoDevicesList = [];

            let camCount = 1;
            let micCount = 1;

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                if (device.kind === 'videoinput') {
                    videoDevicesList.push(device.deviceId);
                    option.text = device.label || `กล้องตัวที่ ${camCount++}`;
                    cameraSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    option.text = device.label || `ไมโครโฟน ${micCount++}`;
                    micSelect.appendChild(option);
                }
            });
        }

        // สลับกล้องแบบเจาะจง ID จาก Dropdown
        function selectHardwareCamera(deviceId) {
            if (deviceId) {
                startNativeCamera(deviceId);
                sendNinjaCommand({ action: 'changeVideoTarget', value: deviceId });
            }
        }

        // สลับกล้องวนแบบปุ่มกดเร็ว
        function switchCameraQuick() {
            if (videoDevicesList.length > 1) {
                currentCamIndex = (currentCamIndex + 1) % videoDevicesList.length;
                const targetDeviceId = videoDevicesList[currentCamIndex];
                document.getElementById('camera-select').value = targetDeviceId;
                selectHardwareCamera(targetDeviceId);
            } else {
                sendNinjaCommand({ action: 'changeVideoTarget' });
            }
        }

        function selectHardwareMic(deviceId) {
            if (deviceId) {
                sendNinjaCommand({ action: 'changeAudioTarget', value: deviceId });
            }
        }

        // เริ่มต้นสร้าง VDO.Ninja Engine
        function initNinjaIframe() {
            if (!pushId) {
                document.getElementById('status-text').innerText = 'NO STREAM ID';
                return;
            }

            let ninjaUrl = `https://vdo.ninja/?push=${pushId}&webcam&autostart&cleanoutput&api=1&cb=0&facing=back`;
            ninjaUrl += `&videobitrate=${currentQualitySettings.bitrate}&maxfps=${currentQualitySettings.maxfps}`;

            iframe.src = ninjaUrl;
        }

        window.addEventListener('message', function(e) {
            if (e.source !== iframe.contentWindow) return;

            try {
                const data = JSON.parse(e.data);
                if (data.action === 'system' && data.value === 'connected') {
                    document.getElementById('status-dot').classList.add('active');
                    document.getElementById('status-text').innerText = 'LIVE ONLINE';
                }
            } catch (err) {}
        });

        function sendNinjaCommand(cmdObject) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify(cmdObject), '*');
            }
        }

        // Controls
        function toggleMute() {
            isMuted = !isMuted;
            if (currentStream) {
                currentStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            }
            sendNinjaCommand({ action: 'mute', value: isMuted });
            const btn = document.getElementById('mute-btn');
            btn.innerText = isMuted ? '🔇' : '🎙️';
            btn.classList.toggle('active-state', isMuted);
        }

        async function toggleTorch() {
            isTorchOn = !isTorchOn;
            if (videoTrack) {
                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if ('torch' in capabilities) {
                    try {
                        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                    } catch (e) { console.warn(e); }
                }
            }
            sendNinjaCommand({ action: 'torch', value: isTorchOn });
            document.getElementById('torch-btn').classList.toggle('active-state', isTorchOn);
        }

        function toggleMirror() {
            isMirrored = !isMirrored;
            videoElement.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
            sendNinjaCommand({ action: 'mirror', value: isMirrored });
            document.getElementById('mirror-btn').classList.toggle('active-state', isMirrored);
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('open');
        }

        function changeConnectionMode(modeKey) {
            if (modeKey === 'custom') return;
            const settings = getQualitySettings(modeKey);
            currentQualitySettings = settings;

            document.getElementById('bitrate-slider').value = settings.bitrate;
            updateBitrateSliderLabel(settings.bitrate);
            document.getElementById('fps-select').value = settings.maxfps.toString();

            sendNinjaCommand({ action: 'bitrate', value: settings.bitrate });
            sendNinjaCommand({ action: 'framerate', value: settings.maxfps });
        }

        function changeBitratePreset(val) {
            let targetBitrate = currentQualitySettings.bitrate;
            if (val !== 'auto' && val !== 'custom') targetBitrate = parseInt(val);
            document.getElementById('bitrate-slider').value = targetBitrate;
            updateBitrateSliderLabel(targetBitrate);
            sendNinjaCommand({ action: 'bitrate', value: targetBitrate });
        }

        function updateBitrateSliderLabel(val) {
            document.getElementById('bitrate-val').innerText = `${parseInt(val).toLocaleString()} k`;
        }

        function changeBitrateValue(val) {
            sendNinjaCommand({ action: 'bitrate', value: parseInt(val) });
        }

        function changeResolution(res) {
            if (res === 'default') return;
            const [w, h] = res.split('x');
            sendNinjaCommand({ action: 'resolution', width: parseInt(w), height: parseInt(h) });
        }

        function changeFPS(fps) {
            sendNinjaCommand({ action: 'framerate', value: parseInt(fps) });
        }

        window.onload = () => {
            startNativeCamera();
        };
    </script>
</body>
</html>
