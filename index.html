<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Mobile Camera Sender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #09090b;
            color: #efeff1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Bar */
        .header {
            background-color: #18181b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f2f35;
            z-index: 10;
        }
        .title-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title-box h1 {
            font-size: 14px;
            color: #00f59b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #23232b;
            border: 1px solid #3f3f46;
            color: #adadb8;
            transition: all 0.3s ease;
        }
        .status-badge.online {
            background: rgba(0, 245, 155, 0.15);
            border-color: #00f59b;
            color: #00f59b;
        }
        .status-badge.connecting {
            background: rgba(255, 204, 0, 0.15);
            border-color: #ffcc00;
            color: #ffcc00;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #71717a;
        }
        .status-badge.online .status-dot {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }
        .status-badge.connecting .status-dot {
            background-color: #ffcc00;
            box-shadow: 0 0 8px #ffcc00;
        }

        /* Video Container */
        .viewport {
            flex: 1;
            position: relative;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #ninja-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        
        /* Overlay Information */
        .stream-info {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #adadb8;
            pointer-events: none;
        }
        .stream-info span {
            color: #00f59b;
            font-family: monospace;
            font-weight: bold;
        }

        /* Controls Panel */
        .controls {
            background-color: #18181b;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 1px solid #2f2f35;
        }
        .btn-action {
            background-color: #23232b;
            border: 1px solid #3f3f46;
            color: #efeff1;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
            background-color: #2f2f35;
        }
        .btn-action.active {
            background-color: rgba(0, 245, 155, 0.15);
            border-color: #00f59b;
            color: #00f59b;
        }
        .btn-action.danger {
            background-color: rgba(255, 75, 75, 0.15);
            border-color: #ff4b4b;
            color: #ff4b4b;
        }
        .btn-icon {
            font-size: 18px;
        }

        /* Warning Banner */
        .warning-banner {
            display: none;
            background-color: #ffcc00;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="warning-banner" id="wake-lock-warning">
        ⚠️ เบราว์เซอร์ไม่รองรับระบบล็อกหน้าจอ กรุณาตั้งค่าไม่ให้หน้าจอดับขณะใช้งาน
    </div>

    <!-- Header -->
    <div class="header">
        <div class="title-box">
            <h1>📷 MOBILE CAM SENDER</h1>
        </div>
        <div class="status-badge" id="status-badge">
            <div class="status-dot"></div>
            <span id="status-text">กำลังเริ่มต้น...</span>
        </div>
    </div>

    <!-- Viewport / WebRTC Iframe -->
    <div class="viewport">
        <div class="stream-info">
            Stream ID: <span id="display-stream-id">...</span>
        </div>
        <iframe id="ninja-frame" allow="camera; microphone; autoplay; display-capture; flashlight;"></iframe>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
        <button class="btn-action" onclick="toggleMute()" id="btn-audio">
            <span class="btn-icon" id="icon-audio">🎙️</span>
            <span id="label-audio">เปิดเสียง</span>
        </button>
        <button class="btn-action" onclick="toggleVideo()" id="btn-video">
            <span class="btn-icon" id="icon-video">📹</span>
            <span id="label-video">เปิดภาพ</span>
        </button>

        <button class="btn-action" onclick="switchCamera()">
            <span class="btn-icon">🔄</span>
            <span>สลับกล้อง</span>
        </button>
        <button class="btn-action" onclick="toggleTorch()" id="btn-torch">
            <span class="btn-icon">💡</span>
            <span>แฟลช</span>
        </button>
    </div>

    <script>
        let streamId = "";
        let quality = "0";
        let isAudioMuted = false;
        let isVideoOff = false;
        let wakeLock = null;

        // ดึงพารามิเตอร์จาก URL
        function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            streamId = urlParams.get('push') || ('mobile_cam_' + Math.random().toString(36).substring(2, 6));
            quality = urlParams.get('quality') || '0';

            document.getElementById('display-stream-id').innerText = streamId;
        }

        // เริ่มต้นสร้าง URL สตรีมเข้า VDO.Ninja
        function initCameraStream() {
            parseUrlParams();

            // พารามิเตอร์ของ VDO.Ninja ฝั่ง Push
            let ninjaUrl = `https://vdo.ninja/?push=${streamId}&autoplay=1&api=1&postmessage=1&label=Mobile_Cam`;
            
            // ตั้งค่าคุณภาพตามโหมดที่เลือกมาจาก Controller
            if (quality === '0') {
                ninjaUrl += `&quality=0&proaudio=1`; // USB / High Performance
            } else if (quality === '1') {
                ninjaUrl += `&quality=1`; // Wi-Fi Standard
            } else if (quality === '2') {
                ninjaUrl += `&quality=2&mbitrate=1500`; // Cellular Data Saver
            }

            const iframe = document.getElementById('ninja-frame');
            iframe.src = ninjaUrl;

            updateStatus('connecting', 'กำลังเชื่อมต่อ...');
        }

        // ดักจับ Event จาก VDO.Ninja
        window.addEventListener('message', function(e) {
            if (!e.data) return;

            let data = e.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(e.data); } catch(err) { return; }
            }

            if (data.action === 'state') {
                if (data.value === 'connected' || data.value === 'playing') {
                    updateStatus('online', 'กำลังถ่ายทอดสด (LIVE)');
                } else if (data.value === 'connecting') {
                    updateStatus('connecting', 'กำลังเชื่อมต่อ...');
                }
            } else if (data.action === 'rtc_connected') {
                updateStatus('online', 'เชื่อมต่อกับ OBS แล้ว');
            } else if (data.action === 'rtc_disconnected') {
                updateStatus('connecting', 'ขาดการติดต่อกับ OBS');
            }
        });

        // ฟังก์ชันสั่งงานไปยัง iframe VDO.Ninja ผ่าน API
        function sendNinjaCommand(cmdObject) {
            const iframe = document.getElementById('ninja-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(cmdObject, '*');
            }
        }

        function toggleMute() {
            isAudioMuted = !isAudioMuted;
            sendNinjaCommand({ action: 'mute', value: isAudioMuted });

            const btn = document.getElementById('btn-audio');
            const icon = document.getElementById('icon-audio');
            const label = document.getElementById('label-audio');

            if (isAudioMuted) {
                btn.classList.add('danger');
                icon.innerText = '🔇';
                label.innerText = 'ปิดเสียง';
            } else {
                btn.classList.remove('danger');
                icon.innerText = '🎙️';
                label.innerText = 'เปิดเสียง';
            }
        }

        function toggleVideo() {
            isVideoOff = !isVideoOff;
            sendNinjaCommand({ action: 'videoMute', value: isVideoOff });

            const btn = document.getElementById('btn-video');
            const icon = document.getElementById('icon-video');
            const label = document.getElementById('label-video');

            if (isVideoOff) {
                btn.classList.add('danger');
                icon.innerText = '📷❌';
                label.innerText = 'ปิดภาพ';
            } else {
                btn.classList.remove('danger');
                icon.innerText = '📹';
                label.innerText = 'เปิดภาพ';
            }
        }

        function switchCamera() {
            sendNinjaCommand({ action: 'changeCamera' });
        }

        function toggleTorch() {
            sendNinjaCommand({ action: 'toggleTorch' });
        }

        function updateStatus(type, text) {
            const badge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            badge.className = 'status-badge';
            if (type === 'online') {
                badge.classList.add('online');
            } else if (type === 'connecting') {
                badge.classList.add('connecting');
            }
            statusText.innerText = text;
        }

        // ป้องกันหน้าจอดับ (Screen Wake Lock API)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                } else {
                    document.getElementById('wake-lock-warning').style.display = 'block';
                }
            } catch (err) {
                console.log('Wake Lock Error:', err);
            }
        }

        // เมื่อสลับแอปแล้วกลับมา ให้ต่อ Wake Lock ใหม่
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        window.onload = function() {
            initCameraStream();
            requestWakeLock();
        };
    </script>
</body>
</html>
