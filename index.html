<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Pro Mobile Camera + Tally Light</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 0px solid transparent;
            transition: border 0.3s ease;
        }

        /* 🔴 สไตล์สำหรับ Tally Light (ON AIR Status) */
        .container.on-air {
            border: 8px solid #ff0000;
            box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.8);
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: #ff0000; box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.6); }
            100% { border-color: #990000; box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.9); }
        }

        /* แถบเตือน ON AIR ตัวหนาด้านบนสุด */
        .tally-banner {
            display: none;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 4px 20px;
            border-radius: 0 0 12px 12px;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            animation: blink 1s infinite;
        }
        .container.on-air .tally-banner {
            display: block;
        }

        @keyframes blink {
            50% { opacity: 0.7; }
        }

        /* iframe VDO.Ninja เต็มจอด้านหลัง */
        #ninja-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Overlay แถบบน */
        .overlay {
            position: relative;
            z-index: 10;
            padding: 16px;
            padding-top: 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .status-badge.on-air-badge {
            background: rgba(255, 0, 0, 0.8);
            border-color: #ff4444;
            color: #fff;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4444;
        }
        .dot.active {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }
        .container.on-air .dot.active {
            background-color: #ffffff;
            box-shadow: 0 0 8px #ffffff;
        }

        /* แถบควบคุมด้านล่าง */
        .controls-bottom {
            position: relative;
            z-index: 10;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }
        .btn-action.active-state {
            background: rgba(0, 245, 155, 0.4);
            border-color: #00f59b;
        }
        .btn-action.tally-active {
            background: rgba(255, 0, 0, 0.6);
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        /* กล่องแจ้งเตือนกลางจอ */
        .info-panel {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            width: 80%;
            max-width: 320px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #00f59b;
        }
        .info-panel p {
            margin: 4px 0;
            font-size: 12px;
            color: #ccc;
        }

        /* แผงเมนูตั้งค่ากล้อง */
        .settings-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 75vh;
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
            z-index: 20;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .settings-panel.open {
            transform: translateY(0);
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .settings-header h3 {
            margin: 0;
            font-size: 18px;
            color: #00f59b;
        }
        .btn-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 16px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .setting-control select, .setting-control input[type="range"] {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .setting-control select option {
            background: #222;
            color: #fff;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-value {
            font-size: 12px;
            color: #00f59b;
            min-width: 35px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- แถบแจ้งเตือน ON AIR ด้านบน -->
        <div class="tally-banner" id="tally-banner">🔴 LIVE ON AIR</div>

        <!-- แถบ Overlay ด้านบน -->
        <div class="overlay">
            <div class="status-badge" id="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">กำลังเตรียมการ...</span>
            </div>
            <div class="status-badge" id="stream-id-display">ID: ---</div>
        </div>

        <!-- VDO.Ninja Engine ใน IFrame -->
        <iframe id="ninja-iframe" allow="camera; microphone; autoplay; display-capture"></iframe>

        <!-- ข้อความแจ้งเตือนกลางจอ -->
        <div class="info-panel" id="info-panel">
            <h2>📱 พร้อมถ่ายทอดสด</h2>
            <p id="mode-text">กำลังโหลดการตั้งค่า...</p>
            <p style="font-size: 10px; color: #888; margin-top: 10px;">หากกล้องไม่ขึ้น ให้กดอนุญาตสิทธิ์กล้อง/ไมค์ บนเบราว์เซอร์</p>
        </div>

        <!-- แถบปุ่มควบคุมด้านล่าง -->
        <div class="controls-bottom">
            <button class="btn-action" onclick="toggleCamera()" title="สลับกล้อง หน้า/หลัง">🔄</button>
            <button class="btn-action" onclick="toggleMute()" id="mute-btn" title="เปิด/ปิด ไมค์">🎙️</button>
            <button class="btn-action" onclick="toggleTallyManual()" id="tally-btn" title="สลับ Tally Light (ทดสอบ On Air)">🚨</button>
            <button class="btn-action" onclick="toggleTorch()" id="torch-btn" title="เปิด/ปิด ไฟฉาย">🔦</button>
            <button class="btn-action" onclick="toggleMirror()" id="mirror-btn" title="กลับด้านภาพ">🪞</button>
            <button class="btn-action" onclick="toggleSettings()" title="ตั้งค่ากล้อง">⚙️</button>
        </div>

        <!-- แผงเมนูตั้งค่ากล้อง -->
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>⚙️ ตั้งค่ากล้อง & สตรีม</h3>
                <button class="btn-close" onclick="toggleSettings()">✖</button>
            </div>

            <!-- เลือกกล้อง -->
            <div class="setting-group">
                <label>เลือกอุปกรณ์กล้อง (Camera Source)</label>
                <div class="setting-control">
                    <select id="camera-select" onchange="changeVideoDevice(this.value)">
                        <option value="">กำลังโหลดรายการกล้อง...</option>
                    </select>
                </div>
            </div>

            <!-- เลือกไมโครโฟน -->
            <div class="setting-group">
                <label>เลือกไมโครโฟน (Audio Source)</label>
                <div class="setting-control">
                    <select id="mic-select" onchange="changeAudioDevice(this.value)">
                        <option value="">กำลังโหลดรายการไมค์...</option>
                    </select>
                </div>
            </div>

            <!-- ปรับความละเอียดวิดีโอ -->
            <div class="setting-group">
                <label>ความละเอียดวิดีโอ (Resolution)</label>
                <div class="setting-control">
                    <select id="res-select" onchange="changeResolution(this.value)">
                        <option value="default">อัตโนมัติ (Default)</option>
                        <option value="1920x1080">1080p Full HD</option>
                        <option value="1280x720">720p HD</option>
                        <option value="640x480">480p SD</option>
                    </select>
                </div>
            </div>

            <!-- ปรับ Framerate -->
            <div class="setting-group">
                <label>เฟรมเรตสูงสุด (Max FPS)</label>
                <div class="setting-control">
                    <select id="fps-select" onchange="changeFPS(this.value)">
                        <option value="60">60 FPS</option>
                        <option value="30" selected>30 FPS</option>
                    </select>
                </div>
            </div>

            <!-- ปรับระยะซูม -->
            <div class="setting-group">
                <label>ซูมภาพ (Zoom)</label>
                <div class="setting-control slider-container">
                    <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="changeZoom(this.value)">
                    <span class="slider-value" id="zoom-val">1.0x</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isMuted = false;
        let isTorchOn = false;
        let isMirrored = false;
        let isOnAir = false;
        const iframe = document.getElementById('ninja-iframe');

        // ดึง URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const pushId = urlParams.get('push');
        const quality = urlParams.get('quality') || '0';

        document.getElementById('stream-id-display').innerText = `ID: ${pushId || 'Unknown'}`;

        function getQualitySettings(q) {
            if (q === '0') {
                return { label: '🔌 USB Mode (บิตเรตสูงสุด / ดีเลย์ต่ำ)', bitrate: 6000, maxfps: 60 };
            } else if (q === '1') {
                return { label: '📶 Wi-Fi Mode (เสถียร / สมดุล)', bitrate: 3500, maxfps: 30 };
            } else {
                return { label: '📡 4G/5G Mode (ประหยัดอินเทอร์เน็ต)', bitrate: 1500, maxfps: 30 };
            }
        }

        const qSettings = getQualitySettings(quality);
        document.getElementById('mode-text').innerText = qSettings.label;

        // เริ่มต้นสร้าง VDO.Ninja Engine
        function initNinja() {
            if (!pushId) {
                alert('ไม่พบ Stream ID! กรุณาสแกน QR Code ใหม่อีกครั้ง');
                document.getElementById('status-text').innerText = 'NO STREAM ID';
                return;
            }

            // เปิดใช้งาน API (&api=1), ซ่อนปุ่ม VDO.Ninja (&cb=0)
            let ninjaUrl = `https://vdo.ninja/?push=${pushId}&webcam&autostart&cleanoutput&api=1&cb=0&facing=back`;
            ninjaUrl += `&videobitrate=${qSettings.bitrate}&maxfps=${qSettings.maxfps}`;

            iframe.src = ninjaUrl;
        }

        // รับข้อมูลสถานะกลับมาจาก VDO.Ninja API
        window.addEventListener('message', function(e) {
            if (e.source !== iframe.contentWindow) return;

            try {
                const data = JSON.parse(e.data);

                // เมื่อระบบเชื่อมต่อสำเร็จ
                if (data.action === 'system' && data.value === 'connected') {
                    document.getElementById('status-dot').classList.add('active');
                    document.getElementById('status-text').innerText = 'ONLINE';

                    setTimeout(() => {
                        document.getElementById('info-panel').style.opacity = '0';
                    }, 3000);

                    sendNinjaCommand({ action: 'getDevices' });
                }

                // 🔴 รับสัญญาณ Tally จาก VDO.Ninja (เมื่อ Director/OBS สั่ง On Air หรือมีการดึงสัญญาณไปใช้งาน)
                if (data.action === 'tally' || data.action === 'active_scene') {
                    setTallyState(data.value === true || data.value === 1 || data.state === 'active');
                }

                // เมื่อมีการดึงฟีดภาพจาก OBS
                if (data.action === 'stream_active') {
                    setTallyState(true);
                }

                if (data.action === 'deviceList') {
                    populateDeviceLists(data.value);
                }
            } catch (err) {
                // ข้ามข้อความที่ไม่ใช่ JSON
            }
        });

        // ส่งคำสั่ง API ไปที่ iframe
        function sendNinjaCommand(cmdObject) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify(cmdObject), '*');
            }
        }

        // === ระบบควบคุม Tally Light ===
        function setTallyState(active) {
            isOnAir = active;
            const container = document.getElementById('main-container');
            const statusText = document.getElementById('status-text');
            const statusBadge = document.getElementById('status-badge');
            const tallyBtn = document.getElementById('tally-btn');

            if (isOnAir) {
                container.classList.add('on-air');
                statusBadge.classList.add('on-air-badge');
                statusText.innerText = 'LIVE ON AIR';
                tallyBtn.classList.add('tally-active');
            } else {
                container.classList.remove('on-air');
                statusBadge.classList.remove('on-air-badge');
                statusText.innerText = 'ONLINE';
                tallyBtn.classList.remove('tally-active');
            }
        }

        // สลับสถานะ Tally ด้วยตนเอง (สำหรับทดสอบหรือแจ้งเตือนฝั่งคนถือกล้อง)
        function toggleTallyManual() {
            setTallyState(!isOnAir);
            // ส่งคำสั่งแจ้ง VDO.Ninja / Director ทราบ
            sendNinjaCommand({ action: 'tally', value: isOnAir });
        }

        // === ฟังก์ชันปุ่มควบคุมหลัก ===

        // 1. สลับกล้อง (หน้า/หลัง)
        function toggleCamera() {
            sendNinjaCommand({ action: 'changeVideoTarget' });
        }

        // 2. เปิด/ปิด ไมโครโฟน
        function toggleMute() {
            isMuted = !isMuted;
            sendNinjaCommand({ action: 'mute', value: isMuted });

            const btn = document.getElementById('mute-btn');
            btn.innerText = isMuted ? '🔇' : '🎙️';
            btn.classList.toggle('active-state', isMuted);
        }

        // 3. เปิด/ปิด ไฟฉาย (Torch)
        function toggleTorch() {
            isTorchOn = !isTorchOn;
            sendNinjaCommand({ action: 'torch', value: isTorchOn });

            const btn = document.getElementById('torch-btn');
            btn.classList.toggle('active-state', isTorchOn);
        }

        // 4. กลับด้านภาพ (Mirror)
        function toggleMirror() {
            isMirrored = !isMirrored;
            sendNinjaCommand({ action: 'mirror', value: isMirrored });

            const btn = document.getElementById('mirror-btn');
            btn.classList.toggle('active-state', isMirrored);
        }

        // 5. เปิด/ปิด เมนูตั้งค่า
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                sendNinjaCommand({ action: 'getDevices' });
            }
        }

        // === ฟังก์ชันการตั้งค่ากล้อง ===

        function populateDeviceLists(devices) {
            const cameraSelect = document.getElementById('camera-select');
            const micSelect = document.getElementById('mic-select');

            cameraSelect.innerHTML = '';
            micSelect.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `${device.kind} (${device.deviceId.slice(0,5)}...)`;

                if (device.kind === 'videoinput') {
                    cameraSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    micSelect.appendChild(option);
                }
            });
        }

        function changeVideoDevice(deviceId) {
            if (deviceId) {
                sendNinjaCommand({ action: 'changeVideoTarget', value: deviceId });
            }
        }

        function changeAudioDevice(deviceId) {
            if (deviceId) {
                sendNinjaCommand({ action: 'changeAudioTarget', value: deviceId });
            }
        }

        function changeResolution(res) {
            if (res === 'default') return;
            const [w, h] = res.split('x');
            sendNinjaCommand({ action: 'resolution', width: parseInt(w), height: parseInt(h) });
        }

        function changeFPS(fps) {
            sendNinjaCommand({ action: 'framerate', value: parseInt(fps) });
        }

        function changeZoom(val) {
            document.getElementById('zoom-val').innerText = `${val}x`;
            sendNinjaCommand({ action: 'zoom', value: parseFloat(val) });
        }

        // เริ่มต้นการทำงาน
        window.onload = () => {
            initNinja();
        };
    </script>
</body>
</html>
