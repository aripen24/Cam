<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Mobile Camera Sender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }
        .overlay {
            position: relative;
            z-index: 10;
            padding: 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4444;
        }
        .dot.active {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }
        .controls-bottom {
            position: relative;
            z-index: 10;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }
        #ninja-iframe {
            display: none;
        }
        .info-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            width: 80%;
            max-width: 320px;
        }
        .info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #00f59b;
        }
        .info-panel p {
            margin: 4px 0;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Overlay ด้านบน -->
        <div class="overlay">
            <div class="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">กำลังเชื่อมต่อ...</span>
            </div>
            <div class="status-badge" id="stream-id-display">ID: ---</div>
        </div>

        <!-- หน้าจอพรีวิวกล้องฝั่งมือถือ -->
        <video id="preview" autoplay playsinline muted></video>

        <!-- ข้อความแจ้งเตือนกลางจอ -->
        <div class="info-panel" id="info-panel">
            <h2>📱 พร้อมถ่ายทอดสด</h2>
            <p id="mode-text">กำลังโหลดการตั้งค่า...</p>
            <p style="font-size: 10px; color: #888; margin-top: 10px;">กดปุ่มอนุญาตสิทธิ์กล้อง/ไมค์ หากมีป๊อปอัปเด้งขึ้นมา</p>
        </div>

        <!-- แถบปุ่มควบคุมด้านล่าง -->
        <div class="controls-bottom">
            <button class="btn-action" onclick="toggleCamera()" title="สลับกล้อง หน้า/หลัง">🔄</button>
            <button class="btn-action" onclick="toggleMute()" id="mute-btn" title="เปิด/ปิด ไมค์">🎙️</button>
        </div>
    </div>

    <!-- IFrame ซ่อนสำหรับรันระบบ VDO.Ninja ด้านหลัง -->
    <iframe id="ninja-iframe" allow="camera; microphone; autoplay; display-capture"></iframe>

    <script>
        let currentFacingMode = 'environment'; // เริ่มต้นใช้กล้องหลัง
        let isMuted = false;
        let localStream = null;

        // ดึงค่า URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const pushId = urlParams.get('push');
        const quality = urlParams.get('quality') || '0';

        document.getElementById('stream-id-display').innerText = `ID: ${pushId || 'Unknown'}`;

        // โหมดคุณภาพตามที่รับมาจาก Dock
        function getQualitySettings(q) {
            if (q === '0') {
                return { label: '🔌 USB Mode (บิตเรตสูงสุด / ดีเลย์ต่ำ)', bitrate: 6000, maxfps: 60 };
            } else if (q === '1') {
                return { label: '📶 Wi-Fi Mode (เสถียร / สมดุล)', bitrate: 3500, maxfps: 30 };
            } else {
                return { label: '📡 4G/5G Mode (ประหยัดอินเทอร์เน็ต)', bitrate: 1500, maxfps: 30 };
            }
        }

        const qSettings = getQualitySettings(quality);
        document.getElementById('mode-text').innerText = qSettings.label;

        // เริ่มต้นขอสิทธิ์เปิดกล้องพรีวิวในหน้ามือถือ
        async function startCamera() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });

                const videoElement = document.getElementById('preview');
                videoElement.srcObject = localStream;

                // อัปเดตสถานะเมื่อกล้องติดแล้ว
                document.getElementById('status-dot').classList.add('active');
                document.getElementById('status-text').innerText = 'LIVE ONLINE';
                
                // ซ่อนกรอบข้อความหลังจากเปิดกล้องสำเร็จ 3 วินาที
                setTimeout(() => {
                    document.getElementById('info-panel').style.opacity = '0';
                    document.getElementById('info-panel').style.transition = 'opacity 0.5s';
                }, 3000);

                // โหลด VDO.Ninja Engine เข้าไปใน iframe
                loadNinjaEngine();

            } catch (err) {
                console.error("Camera access error:", err);
                document.getElementById('status-text').innerText = 'เกิดข้อผิดพลาดในการเปิดกล้อง';
                alert('ไม่สามารถเข้าถึงกล้องหรือไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ในเบราว์เซอร์');
            }
        }

        // โหลด VDO.Ninja สำหรับส่งสัญญาณภาพไป OBS
        function loadNinjaEngine() {
            if (!pushId) return;

            let ninjaUrl = `https://vdo.ninja/?push=${pushId}&webcam&autostart&cleanoutput`;
            
            // ใส่พารามิเตอร์คุณภาพตามที่เลือกจาก Dock
            ninjaUrl += `&videobitrate=${qSettings.bitrate}&maxfps=${qSettings.maxfps}`;
            
            if (currentFacingMode === 'environment') {
                ninjaUrl += `&facing=back`;
            } else {
                ninjaUrl += `&facing=front`;
            }

            const iframe = document.getElementById('ninja-iframe');
            iframe.src = ninjaUrl;
        }

        // สลับกล้องหน้า / หลัง
        function toggleCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        // เปิด / ปิด ไมโครโฟน
        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMuted = !isMuted;
                    audioTrack.enabled = !isMuted;
                    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🎙️';
                    document.getElementById('mute-btn').style.background = isMuted ? 'rgba(255,0,0,0.5)' : 'rgba(255,255,255,0.15)';
                }
            }
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        window.onload = () => {
            if (!pushId) {
                alert('ไม่พบ Stream ID! กรุณาสแกน QR Code ใหม่อีกครั้งจาก OBS Dock');
                document.getElementById('status-text').innerText = 'NO STREAM ID';
                return;
            }
            startCamera();
        };
    </script>
</body>
</html>
