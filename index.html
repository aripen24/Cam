<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Mobile Cam - Auto Share</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Bar */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 20;
        }

        /* LIVE Indicator Badge */
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #71717a;
        }
        .live-badge.online {
            border-color: #00f59b;
            color: #00f59b;
            background: rgba(0, 245, 155, 0.15);
        }
        .live-badge.online .status-dot {
            background-color: #00f59b;
            box-shadow: 0 0 10px #00f59b;
            animation: pulse 1.5s infinite;
        }
        .live-badge.connecting {
            border-color: #ffcc00;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.15);
        }
        .live-badge.connecting .status-dot {
            background-color: #ffcc00;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .hud-info {
            font-size: 11px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .hud-info span {
            color: #00f59b;
            font-weight: bold;
        }

        /* Viewport / Frame */
        .camera-viewport {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ninja-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Composition Grid Overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 10;
        }
        .grid-overlay.active {
            display: grid;
        }
        .grid-box {
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }

        /* Bottom Control Deck */
        .hud-bottom {
            background: rgba(12, 12, 15, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            backdrop-filter: blur(12px);
        }

        /* Audio VU Meter Bar */
        .vu-meter-container {
            width: 100%;
            height: 4px;
            background: #1a1a20;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }
        .vu-meter-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00f59b 70%, #ffcc00 85%, #ff4b4b 100%);
            transition: width 0.1s ease;
        }

        /* Control Buttons Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-items: center;
        }

        .btn-cam {
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 12px;
            height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-cam:active {
            transform: scale(0.92);
            background: #2a2a35;
        }
        .btn-cam .icon {
            font-size: 18px;
        }
        .btn-cam.active {
            background: rgba(0, 245, 155, 0.15);
            border-color: #00f59b;
            color: #00f59b;
        }
        .btn-cam.danger {
            background: rgba(255, 75, 75, 0.15);
            border-color: #ff4b4b;
            color: #ff4b4b;
        }

        .btn-cam.primary {
            background: #9146ff;
            border: none;
            color: #ffffff;
        }
        .btn-cam.primary:active {
            background: #772ce8;
        }

        /* Notification Toast */
        .toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00f59b;
            color: #00f59b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 30;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Notification Toast -->
    <div class="toast" id="toast">แชร์กล้องทันที...</div>

    <!-- Top HUD Bar -->
    <div class="hud-top">
        <div class="live-badge" id="live-badge">
            <div class="status-dot"></div>
            <span id="live-text">AUTO START...</span>
        </div>
        <div class="hud-info" onclick="copyObsLink()" title="คลิกเพื่อคัดลอกลิงก์ OBS View">
            ID: <span id="hud-stream-id">...</span> 📋
        </div>
    </div>

    <!-- Camera Viewport -->
    <div class="camera-viewport">
        <!-- 3x3 Grid Lines -->
        <div class="grid-overlay" id="grid-overlay">
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
            <div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
        </div>

        <!-- iframe VDO.Ninja สั่ง Auto-start & Push ทันที -->
        <iframe id="ninja-frame" allow="camera; microphone; autoplay; display-capture; flashlight;"></iframe>
    </div>

    <!-- Bottom Control Deck -->
    <div class="hud-bottom">
        <!-- Audio VU Meter Bar -->
        <div class="vu-meter-container">
            <div class="vu-meter-bar" id="vu-bar"></div>
        </div>

        <!-- Camera Controls -->
        <div class="controls-grid">
            <button class="btn-cam" id="btn-mic" onclick="toggleMic()">
                <span class="icon" id="icon-mic">🎙️</span>
                <span id="label-mic">ไมค์</span>
            </button>

            <button class="btn-cam" id="btn-video" onclick="toggleVideo()">
                <span class="icon" id="icon-video">📹</span>
                <span id="label-video">ภาพ</span>
            </button>

            <button class="btn-cam primary" onclick="switchCamera()">
                <span class="icon">🔄</span>
                <span>สลับกล้อง</span>
            </button>

            <button class="btn-cam" id="btn-torch" onclick="toggleTorch()">
                <span class="icon">💡</span>
                <span>แฟลช</span>
            </button>

            <button class="btn-cam" id="btn-grid" onclick="toggleGrid()">
                <span class="icon">🌐</span>
                <span>เส้นตาราง</span>
            </button>
        </div>
    </div>

    <script>
        let streamId = "";
        let quality = "0";
        let isMuted = false;
        let isVideoOff = false;
        let isGridOn = false;
        let wakeLock = null;

        function parseParams() {
            const urlParams = new URLSearchParams(window.location.search);
            streamId = urlParams.get('push') || ('cam_' + Math.random().toString(36).substring(2, 6));
            quality = urlParams.get('quality') || '0';

            document.getElementById('hud-stream-id').innerText = streamId;
        }

        function initStream() {
            parseParams();

            let ninjaUrl = `https://vdo.ninja/?push=${streamId}&autostart=1&autoplay=1&cleanoutput=1&api=1&postmessage=1&label=Mobile_Cam&meter=1`;

            if (quality === '0') {
                ninjaUrl += `&quality=0&proaudio=1`;
            } else if (quality === '1') {
                ninjaUrl += `&quality=1`;
            } else if (quality === '2') {
                ninjaUrl += `&quality=2&mbitrate=1200`;
            }

            document.getElementById('ninja-frame').src = ninjaUrl;
            updateBadge('connecting', 'STARTING CAM...');
        }

        // คัดลอกลิงก์ OBS View ไปใช้ในคอม
        function copyObsLink() {
            const obsUrl = `https://vdo.ninja/?view=${streamId}`;
            navigator.clipboard.writeText(obsUrl).then(() => {
                showToast("คัดลอกลิงก์ OBS เรียบร้อย!");
            }).catch(() => {
                showToast("ไม่สามารถคัดลอกลิงก์ได้");
            });
        }

        // ฟัง Event และระดับเสียงจาก VDO.Ninja
        window.addEventListener('message', function(e) {
            if (!e.data) return;

            let data = e.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(e.data); } catch(err) { return; }
            }

            if (data.action === 'volume') {
                const volumePercent = Math.min(100, Math.max(0, data.value * 100));
                document.getElementById('vu-bar').style.width = isMuted ? '0%' : volumePercent + '%';
            }

            if (data.action === 'state') {
                if (data.value === 'connected' || data.value === 'playing') {
                    updateBadge('online', 'LIVE');
                } else if (data.value === 'connecting') {
                    updateBadge('connecting', 'CONNECTING...');
                }
            } else if (data.action === 'rtc_connected') {
                updateBadge('online', 'OBS CONNECTED');
            } else if (data.action === 'rtc_disconnected') {
                updateBadge('connecting', 'RECONNECTING...');
            }
        });

        function sendCommand(cmd) {
            const iframe = document.getElementById('ninja-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(cmd, '*');
            }
        }

        function toggleMic() {
            isMuted = !isMuted;
            sendCommand({ action: 'mute', value: isMuted });

            const btn = document.getElementById('btn-mic');
            const icon = document.getElementById('icon-mic');
            const label = document.getElementById('label-mic');

            if (isMuted) {
                btn.classList.add('danger');
                icon.innerText = '🔇';
                label.innerText = 'ปิดแล้ว';
                document.getElementById('vu-bar').style.width = '0%';
            } else {
                btn.classList.remove('danger');
                icon.innerText = '🎙️';
                label.innerText = 'ไมค์';
            }
            showToast(isMuted ? "ปิดไมค์แล้ว" : "เปิดไมค์แล้ว");
        }

        function toggleVideo() {
            isVideoOff = !isVideoOff;
            sendCommand({ action: 'videoMute', value: isVideoOff });

            const btn = document.getElementById('btn-video');
            const icon = document.getElementById('icon-video');
            const label = document.getElementById('label-video');

            if (isVideoOff) {
                btn.classList.add('danger');
                icon.innerText = '📷❌';
                label.innerText = 'พักภาพ';
            } else {
                btn.classList.remove('danger');
                icon.innerText = '📹';
                label.innerText = 'ภาพ';
            }
            showToast(isVideoOff ? "ปิดภาพชั่วคราว" : "เปิดภาพแล้ว");
        }

        function switchCamera() {
            sendCommand({ action: 'changeCamera' });
            showToast("สลับกล้องแล้ว");
        }

        function toggleTorch() {
            sendCommand({ action: 'toggleTorch' });
            showToast("เปิด/ปิด แฟลช");
        }

        function toggleGrid() {
            isGridOn = !isGridOn;
            const grid = document.getElementById('grid-overlay');
            const btn = document.getElementById('btn-grid');

            if (isGridOn) {
                grid.classList.add('active');
                btn.classList.add('active');
            } else {
                grid.classList.remove('active');
                btn.classList.remove('active');
            }
        }

        function updateBadge(status, text) {
            const badge = document.getElementById('live-badge');
            const label = document.getElementById('live-text');

            badge.className = 'live-badge ' + status;
            label.innerText = text;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        // ล็อกหน้าจอไม่ให้ดับขณะสตรีม
        async function enableWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await enableWakeLock();
            }
        });

        window.onload = function() {
            initStream();
            enableWakeLock();
        };
    </script>
</body>
</html>
