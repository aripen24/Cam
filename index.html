<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Cam Sender UI (VDO.Ninja Compatible)</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --bg-glass: rgba(18, 19, 24, 0.65);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Fullscreen Video / Canvas Container */
        .viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 9-Grid Overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-overlay.active {
            opacity: 1;
        }

        .grid-cell {
            border: 0.5px solid rgba(255, 255, 255, 0.25);
        }

        /* Top Status Bar */
        .status-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--danger-color);
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Ergonomic Right Controls Panel */
        .control-dock-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            padding: 12px 10px;
            border-radius: 28px;
            z-index: 10;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Auto-Hide Utility Class */
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .btn-action {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-action.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Zoom Slider Slider Box */
        .zoom-slider-container {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            padding: 12px 8px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 180px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .zoom-slider-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        .zoom-slider-container input[type="range"] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 6px;
            height: 120px;
            accent-color: var(--accent-color);
        }

        /* Embedded VDO.Ninja Frame (Hidden Processing Engine) */
        #ninja-frame {
            display: none;
        }
    </style>
</head>
<body>

    <div class="viewport" id="app-viewport">
        <!-- Live Local Video Preview -->
        <video id="webcam-preview" autoplay playsinline muted></video>

        <!-- 9-Grid Lines -->
        <div class="grid-overlay" id="grid-overlay">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <!-- Top Telemetry & Status -->
        <div class="status-bar" id="status-bar">
            <div class="live-dot"></div>
            <span id="stream-status">LIVE | ROOM: CAM1</span>
            <span style="opacity: 0.5;">|</span>
            <span id="fps-counter">60 FPS</span>
        </div>

        <!-- Vertical Zoom Slider Popup -->
        <div class="zoom-slider-container" id="zoom-container">
            <span style="font-size: 0.7rem;" id="zoom-val">1.0x</span>
            <input type="range" id="zoom-range" min="1" max="5" step="0.1" value="1">
            <i data-lucide="zoom-in" size="14"></i>
        </div>

        <!-- Right Ergonomic Action Bar -->
        <div class="control-dock-right" id="control-dock">
            <button class="btn-action" id="btn-grid" title="Grid 9 ช่อง">
                <i data-lucide="grid-3x3" size="20"></i>
            </button>
            <button class="btn-action" id="btn-zoom" title="ปรับระยะ Zoom">
                <i data-lucide="search" size="20"></i>
            </button>
            <button class="btn-action" id="btn-focus" title="ล็อคโฟกัส AF/MF">
                <i data-lucide="focus" size="20"></i>
            </button>
            <button class="btn-action" id="btn-flash" title="เปิด/ปิด Flash">
                <i data-lucide="zap" size="20"></i>
            </button>
            <button class="btn-action" id="btn-flip" title="สลับกล้อง หน้า/หลัง">
                <i data-lucide="switch-camera" size="20"></i>
            </button>
        </div>
    </div>

    <!-- Hidden iframe for VDO.Ninja Engine -->
    <iframe id="ninja-frame" allow="camera;microphone"></iframe>

    <script>
        let currentStream = null;
        let videoTrack = null;
        let uiTimeout = null;
        let isFocusLocked = false;
        let isFlashOn = false;
        let facingMode = "environment"; // กล้องหลังโดยเริ่มต้น

        const videoElem = document.getElementById('webcam-preview');
        const gridOverlay = document.getElementById('grid-overlay');
        const zoomContainer = document.getElementById('zoom-container');
        const zoomRange = document.getElementById('zoom-range');
        const zoomVal = document.getElementById('zoom-val');

        // 1. เริ่มระบบกล้องด้วย MediaStreams API
        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60, max: 60 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElem.srcObject = currentStream;
                videoTrack = currentStream.getVideoTracks()[0];

                // ตรวจสอบความสามารถของกล้องที่เบราว์เซอร์รองรับ (Hardware capabilities)
                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                
                // ปรับค่า Zoom Min/Max ให้ตรงกับตัวกล้องมือถือ
                if (capabilities.zoom) {
                    zoomRange.min = capabilities.zoom.min;
                    zoomRange.max = capabilities.zoom.max;
                    zoomRange.step = capabilities.zoom.step;
                }

                // เชื่อมต่อไปยัง VDO.Ninja Engine ยิงท่อ push ไปยัง Control Center
                setupVDONinja();

            } catch (err) {
                console.error("Camera Access Error: ", err);
                alert("ไม่สามารถเข้าถึงกล้องได้ โปรดตรวจสอบการอนุญาตสิทธิ์");
            }
        }

        // 2. ตั้งค่า VDO.Ninja Integration
        function setupVDONinja() {
            const roomName = "LIVE_DOCK_CAM1"; // ชื่อห้องเชื่อมต่อกับ Control Center
            const pushStreamId = "CAM_SENDER_01";
            
            // Parameter &ptz &quality=0 เพื่อภาพคมชัดสูงและควบคุมระยะได้
            const ninjaUrl = `https://vdo.ninja/?push=${pushStreamId}&room=${roomName}&quality=0&autostart&cleanoutput&ptz`;
            document.getElementById('ninja-frame').src = ninjaUrl;
        }

        // 3. ปรับ Zoom เรียลไทม์
        zoomRange.addEventListener('input', async (e) => {
            const value = e.target.value;
            zoomVal.innerText = `${parseFloat(value).toFixed(1)}x`;
            if (videoTrack && 'applyConstraints' in videoTrack) {
                try {
                    await videoTrack.applyConstraints({ advanced: [{ zoom: value }] });
                } catch (err) {
                    console.log("Zoom not supported on this device track");
                }
            }
        });

        // 4. ล็อคโฟกัส (Focus Lock)
        document.getElementById('btn-focus').addEventListener('click', async function() {
            isFocusLocked = !isFocusLocked;
            this.classList.toggle('active', isFocusLocked);

            if (videoTrack && 'applyConstraints' in videoTrack) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ focusMode: isFocusLocked ? 'manual' : 'continuous' }]
                    });
                } catch (err) {
                    console.log("Focus mode change not supported");
                }
            }
        });

        // 5. สลับเปิด/ปิด ไฟแฟลช (Torch)
        document.getElementById('btn-flash').addEventListener('click', async function() {
            isFlashOn = !isFlashOn;
            this.classList.toggle('active', isFlashOn);

            if (videoTrack && 'applyConstraints' in videoTrack) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ torch: isFlashOn }]
                    });
                } catch (err) {
                    alert("อุปกรณ์นี้ไม่รองรับการเปิดไฟแฟลชผ่านเว็บ Browser");
                }
            }
        });

        // 6. เปิด/ปิด เส้น Grid 9 ช่อง
        document.getElementById('btn-grid').addEventListener('click', function() {
            gridOverlay.classList.toggle('active');
            this.classList.toggle('active');
        });

        // 7. Toggle Zoom Control Popup
        document.getElementById('btn-zoom').addEventListener('click', function() {
            zoomContainer.classList.toggle('show');
            this.classList.toggle('active');
        });

        // 8. สลับกล้องหน้า/หลัง (Memory Lens support)
        document.getElementById('btn-flip').addEventListener('click', () => {
            facingMode = (facingMode === "user") ? "environment" : "user";
            localStorage.setItem('preferred_lens', facingMode); // บันทึกลง Memory
            initCamera();
        });

        // 9. ระบบ Auto-Hide UI เมื่อไม่ได้แตะหน้าจอ (Ergonomic Support)
        function resetUINodeTimer() {
            document.getElementById('control-dock').classList.remove('ui-hidden');
            document.getElementById('status-bar').classList.remove('ui-hidden');

            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                document.getElementById('control-dock').classList.add('ui-hidden');
                document.getElementById('status-bar').classList.add('ui-hidden');
                zoomContainer.classList.remove('show');
                document.getElementById('btn-zoom').classList.remove('active');
            }, 5000); // 5 วินาที
        }

        document.getElementById('app-viewport').addEventListener('touchstart', resetUINodeTimer);
        document.getElementById('app-viewport').addEventListener('mousemove', resetUINodeTimer);

        // โหลดค่ากล้องล่าสุดที่เคยเลือกไว้ (Memory Lens)
        const savedLens = localStorage.getItem('preferred_lens');
        if (savedLens) facingMode = savedLens;

        // เริ่มต้นการทำงานและ Lucide Icons
        lucide.createIcons();
        initCamera();
        resetUINodeTimer();
    </script>
</body>
</html>
