<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Mobile Sender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121214;
            color: #efeff1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ส่วนแสดงผลวิดีโอจากกล้องมือถือ */
        #video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* แถบสถานะด้านบน */
        .status-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4f4f;
        }
        .status-pill.connected .dot {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }
        .stream-id-badge {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            color: #00f59b;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* แถบควบคุมด้านล่าง */
        .control-bar {
            background: #1f1f23;
            padding: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #2f2f35;
        }
        button {
            background-color: #2f2f35;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            transition: background 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }
        button.btn-primary {
            background-color: #9146ff;
        }
        button.btn-primary:hover {
            background-color: #772ce8;
        }
        button.btn-danger {
            background-color: #eb0400;
        }
        
        /* หน้าจอแจ้งเตือนกรณีไม่มี Stream ID */
        #error-screen {
            position: absolute;
            inset: 0;
            background: #121214;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 100;
            display: none;
        }
        #error-screen h2 {
            color: #ff4f4f;
            margin-bottom: 8px;
            font-size: 18px;
        }
        #error-screen p {
            color: #adadb8;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- หน้าจอแสดงผลวิดีโอ -->
    <div id="video-container">
        <div class="status-bar">
            <div class="status-pill" id="status-pill">
                <span class="dot"></span>
                <span id="status-text">กำลังเชื่อมต่อ...</span>
            </div>
            <div class="stream-id-badge" id="display-id">ID: ---</div>
        </div>

        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <!-- แถบปุ่มควบคุมการทำงาน -->
    <div class="control-bar">
        <button onclick="switchCamera()" class="btn-primary">🔄 สลับกล้องหน้า/หลัง</button>
        <button onclick="toggleMute()" id="mute-btn" class="btn-primary">🎤 ปิดไมค์</button>
    </div>

    <!-- หน้าต่างแจ้งเตือนข้อผิดพลาด -->
    <div id="error-screen">
        <h2>⚠️ ไม่พบ Stream ID</h2>
        <p>กรุณาสแกน QR Code จากหน้าจอ Controller ฝั่ง OBS อีกครั้งเพื่อเปิดใช้งานกล้อง</p>
    </div>

    <!-- ซ่อน iframe สำหรับส่งสัญญาณ Push ไปยัง VDO.Ninja -->
    <iframe id="ninja-push-iframe" style="display:none;" allow="autoplay; camera; microphone"></iframe>

    <script>
        let currentStreamId = "";
        let useFrontCamera = false;
        let isMuted = false;
        let localStream = null;

        // ดึงค่า Stream ID จากพารามิเตอร์ ?push= ใน URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function initMobileSender() {
            currentStreamId = getQueryParam('push');

            if (!currentStreamId) {
                document.getElementById('error-screen').style.display = 'flex';
                return;
            }

            document.getElementById('display-id').innerText = `ID: ${currentStreamId}`;

            // โหลด iframe ของ VDO.Ninja ในโหมด push เพื่อเชื่อมต่อสัญญาณเบื้องหลัง
            const pushUrl = `https://vdo.ninja/?push=${currentStreamId}&autoplay=1&vdppin=&webcam`;
            document.getElementById('ninja-push-iframe').src = pushUrl;

            // เริ่มเปิดกล้องและไมโครโฟนมือถือ
            await startCamera();
        }

        async function startCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: true
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('local-video');
                videoElement.srcObject = localStream;

                updateStatus('connected', 'ออนไลน์');
            } catch (err) {
                console.error("Camera Error:", err);
                updateStatus('disconnected', 'ไม่สามารถเข้าถึงกล้องได้');
                alert("กรุณาอนุญาตให้เว็บไซต์เข้าถึงกล้องและไมโครโฟน");
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                const muteBtn = document.getElementById('mute-btn');
                if (isMuted) {
                    muteBtn.innerText = "🔇 เปิดไมค์";
                    muteBtn.classList.add('btn-danger');
                } else {
                    muteBtn.innerText = "🎤 ปิดไมค์";
                    muteBtn.classList.remove('btn-danger');
                }
            }
        }

        function updateStatus(state, text) {
            const pill = document.getElementById('status-pill');
            const statusText = document.getElementById('status-text');
            
            statusText.innerText = text;
            if (state === 'connected') {
                pill.classList.add('connected');
            } else {
                pill.classList.remove('connected');
            }
        }

        // เริ่มต้นทำงานทันทีเมื่อโหลดหน้าเว็บ
        window.onload = initMobileSender;
    </script>
</body>
</html>
