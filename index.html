<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Streamer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ninja-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .loading-box {
            position: absolute;
            z-index: 2;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #00f59b;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00f59b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #00f59b;
        }
    </style>
</head>
<body>

    <div class="loading-box" id="loading">
        <div class="spinner"></div>
        <p>กำลังเปิดกล้องและเชื่อมต่อสตรีม...</p>
    </div>

    <iframe id="ninja-frame" allow="camera; microphone; autoplay; display-capture; autoplay"></iframe>

    <script>
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                push: params.get('push'),
                front: params.get('front'),
                res: params.get('res'),
                quality: params.get('quality')
            };
        }

        function initCam() {
            const { push, front, res, quality } = getQueryParams();
            const iframe = document.getElementById('ninja-frame');

            if (!push) {
                document.getElementById('loading').innerHTML = '<p style="color:#ff4444;">❌ ไม่พบ Stream ID โปรดสแกน QR Code ใหม่</p>';
                return;
            }

            // สร้าง URL สำหรับ VDO.Ninja Push
            let targetUrl = `https://vdo.ninja/?push=${push}&autoplay=1&autostart=1`;

            // อ่านค่าสลับกล้องหน้า/หลัง
            if (front === '1') {
                targetUrl += `&facing=front`;
            } else if (front === '0') {
                targetUrl += `&facing=back`;
            }

            // อ่านค่าความละเอียด
            if (res) {
                targetUrl += `&quality=0&res=${res}`;
            }

            // อ่านค่าโหมดคุณภาพการเชื่อมต่อ
            if (quality !== null) {
                if (quality === '0') targetUrl += `&mbitrate=8000&maxbitrate=8000`; // USB latency ต่ำ บิตเรตสูง
                else if (quality === '1') targetUrl += `&mbitrate=4000`;             // Wi-Fi
                else if (quality === '2') targetUrl += `&mbitrate=1500`;             // Cellular ประหยัดเน็ต
            }

            // ผูก URL ใส่ Iframe
            iframe.src = targetUrl;

            // ซ่อนหน้าจอ Loading เมื่อโหลด Iframe เสร็จสิ้น
            iframe.onload = () => {
                setTimeout(() => {
                    const loading = document.getElementById('loading');
                    if (loading) loading.style.display = 'none';
                }, 1000);
            };
        }

        window.onload = initCam;
    </script>
</body>
</html>
