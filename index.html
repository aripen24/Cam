<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Pro Mobile Camera Sender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* iframe VDO.Ninja เต็มจอด้านหลัง */
        #ninja-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Overlay แถบบน */
        .overlay {
            position: relative;
            z-index: 10;
            padding: 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4444;
        }
        .dot.active {
            background-color: #00f59b;
            box-shadow: 0 0 8px #00f59b;
        }

        /* แถบปรับ Zoom บนหน้าจอหลัก (ด้านขวา) */
        .zoom-overlay {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 16px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            gap: 12px;
        }
        .zoom-slider-vertical {
            writing-mode: bt-lr; /* IE/Edge */
            -webkit-appearance: slider-vertical; /* WebKit */
            width: 8px;
            height: 160px;
            accent-color: #00f59b;
            cursor: pointer;
        }
        .zoom-label {
            font-size: 11px;
            font-weight: bold;
            color: #00f59b;
        }

        /* แถบควบคุมด้านล่าง */
        .controls-bottom {
            position: relative;
            z-index: 10;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }
        .btn-action.active-state {
            background: rgba(0, 245, 155, 0.4);
            border-color: #00f59b;
        }

        /* แผงเมนูตั้งค่ากล้อง (Settings Drawer) */
        .settings-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 85vh;
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
            z-index: 20;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .settings-panel.open {
            transform: translateY(0);
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .settings-header h3 {
            margin: 0;
            font-size: 18px;
            color: #00f59b;
        }
        .btn-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 16px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .setting-control select, .setting-control input[type="range"] {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .setting-control select option {
            background: #222;
            color: #fff;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-value {
            font-size: 12px;
            color: #00f59b;
            min-width: 55px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบ Overlay ด้านบน -->
        <div class="overlay">
            <div class="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">กำลังเตรียมการ...</span>
            </div>
            <div class="status-badge" id="stream-id-display">ID: ---</div>
        </div>

        <!-- VDO.Ninja Engine ใน IFrame -->
        <iframe id="ninja-iframe" allow="camera; microphone; autoplay; display-capture"></iframe>

        <!-- หลอดซูมบนหน้าจอหลัก (ด้านขวา) -->
        <div class="zoom-overlay">
            <span class="zoom-label" id="main-zoom-val">1.0x</span>
            <input type="range" class="zoom-slider-vertical" id="main-zoom-slider" min="1" max="5" step="0.1" value="1" oninput="changeZoom(this.value)">
            <span style="font-size: 12px;">🔍</span>
        </div>

        <!-- แถบปุ่มควบคุมด้านล่าง -->
        <div class="controls-bottom">
            <button class="btn-action" onclick="toggleCamera()" title="สลับกล้อง หน้า/หลัง">🔄</button>
            <button class="btn-action" onclick="toggleMute()" id="mute-btn" title="เปิด/ปิด ไมค์">🎙️</button>
            <button class="btn-action" onclick="toggleTorch()" id="torch-btn" title="เปิด/ปิด ไฟฉาย">🔦</button>
            <button class="btn-action" onclick="toggleMirror()" id="mirror-btn" title="กลับด้านภาพ">🪞</button>
            <button class="btn-action" onclick="toggleSettings()" title="ตั้งค่ากล้อง">⚙️</button>
        </div>

        <!-- แผงเมนูตั้งค่ากล้อง & Bitrate (Settings Drawer) -->
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>⚙️ ตั้งค่ากล้อง & การเชื่อมต่อ</h3>
                <button class="btn-close" onclick="toggleSettings()">✖</button>
            </div>

            <!-- เลือกกล้อง (รองรับทุกเลนส์ของมือถือ) -->
            <div class="setting-group">
                <label>เลือกอุปกรณ์กล้อง (Camera Source)</label>
                <div class="setting-control">
                    <select id="camera-select" onchange="changeVideoDevice(this.value)">
                        <option value="">กำลังโหลดรายการกล้อง...</option>
                    </select>
                </div>
            </div>

            <!-- เลือกโหมดการเชื่อมต่อ (Connection Mode) -->
            <div class="setting-group">
                <label>โหมดการเชื่อมต่อ (Connection Mode)</label>
                <div class="setting-control">
                    <select id="connection-mode-select" onchange="changeConnectionMode(this.value)">
                        <option value="0">🔌 USB Mode (บิตเรตสูงสุด / ดีเลย์ต่ำสุด)</option>
                        <option value="1">📶 Wi-Fi Mode (เสถียร / สมดุล)</option>
                        <option value="2">📡 4G/5G Mode (ประหยัดอินเทอร์เน็ต)</option>
                        <option value="custom">⚙️ Custom Mode (ตั้งค่ากำหนดเอง)</option>
                    </select>
                </div>
            </div>

            <!-- ปรับเลือก Bitrate -->
            <div class="setting-group">
                <label>อัตราบิตเรต (Bitrate Selection)</label>
                <div class="setting-control">
                    <select id="bitrate-select" onchange="changeBitratePreset(this.value)">
                        <option value="auto">ตามโหมดการเชื่อมต่อ</option>
                        <option value="1000">1,000 kbps (1 Mbps - ประหยัดเน็ต)</option>
                        <option value="2500">2,500 kbps (2.5 Mbps - เน็ตมือถือ)</option>
                        <option value="3500">3,500 kbps (3.5 Mbps - Wi-Fi ทั่วไป)</option>
                        <option value="6000">6,000 kbps (6 Mbps - USB / Wi-Fi แรง)</option>
                        <option value="10000">10,000 kbps (10 Mbps - USB High Quality)</option>
                        <option value="15000">15,000 kbps (15 Mbps - Ultra HD)</option>
                        <option value="custom">กำหนดเอง (Manual Slider)</option>
                    </select>
                </div>
            </div>

            <!-- Slider ปรับ Bitrate แบบกำหนดเอง -->
            <div class="setting-group" id="custom-bitrate-group">
                <label>ปรับ Bitrate แบบละเอียด (kbps)</label>
                <div class="setting-control slider-container">
                    <input type="range" id="bitrate-slider" min="500" max="20000" step="500" value="3500" oninput="updateBitrateSliderLabel(this.value)" onchange="changeBitrateValue(this.value)">
                    <span class="slider-value" id="bitrate-val">3,500 k</span>
                </div>
            </div>

            <!-- เลือกไมโครโฟน -->
            <div class="setting-group">
                <label>เลือกไมโครโฟน (Audio Source)</label>
                <div class="setting-control">
                    <select id="mic-select" onchange="changeAudioDevice(this.value)">
                        <option value="">กำลังโหลดรายการไมค์...</option>
                    </select>
                </div>
            </div>

            <!-- ปรับความละเอียดวิดีโอ -->
            <div class="setting-group">
                <label>ความละเอียดวิดีโอ (Resolution)</label>
                <div class="setting-control">
                    <select id="res-select" onchange="changeResolution(this.value)">
                        <option value="default">อัตโนมัติ (Default)</option>
                        <option value="3840x2160">4K Ultra HD</option>
                        <option value="1920x1080">1080p Full HD</option>
                        <option value="1280x720">720p HD</option>
                        <option value="640x480">480p SD</option>
                    </select>
                </div>
            </div>

            <!-- ปรับ Framerate -->
            <div class="setting-group">
                <label>เฟรมเรตสูงสุด (Max FPS)</label>
                <div class="setting-control">
                    <select id="fps-select" onchange="changeFPS(this.value)">
                        <option value="60">60 FPS</option>
                        <option value="30">30 FPS</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isMuted = false;
        let isTorchOn = false;
        let isMirrored = false;
        const iframe = document.getElementById('ninja-iframe');

        // ดึง URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const pushId = urlParams.get('push');
        const initialQuality = urlParams.get('quality') || '0';

        document.getElementById('stream-id-display').innerText = `ID: ${pushId || 'Unknown'}`;

        // การตั้งค่าตามโหมดการเชื่อมต่อ
        function getQualitySettings(q) {
            if (q === '0') {
                return { label: '🔌 USB Mode (บิตเรตสูงสุด / ดีเลย์ต่ำ)', bitrate: 6000, maxfps: 60, res: '1920x1080' };
            } else if (q === '1') {
                return { label: '📶 Wi-Fi Mode (เสถียร / สมดุล)', bitrate: 3500, maxfps: 30, res: '1280x720' };
            } else {
                return { label: '📡 4G/5G Mode (ประหยัดอินเทอร์เน็ต)', bitrate: 1500, maxfps: 30, res: '1280x720' };
            }
        }

        let currentQualitySettings = getQualitySettings(initialQuality);
        
        // ตั้งค่าตัวเลือกในหน้า UI ให้ตรงกับพารามิเตอร์เริ่มต้น
        document.getElementById('connection-mode-select').value = initialQuality;
        document.getElementById('bitrate-slider').value = currentQualitySettings.bitrate;
        document.getElementById('bitrate-val').innerText = `${currentQualitySettings.bitrate.toLocaleString()} k`;
        document.getElementById('fps-select').value = currentQualitySettings.maxfps.toString();

        // เริ่มต้นสร้าง VDO.Ninja Engine
        function initNinja() {
            if (!pushId) {
                alert('ไม่พบ Stream ID! กรุณาสแกน QR Code ใหม่อีกครั้ง');
                document.getElementById('status-text').innerText = 'NO STREAM ID';
                return;
            }

            let ninjaUrl = `https://vdo.ninja/?push=${pushId}&webcam&autostart&cleanoutput&api=1&cb=0&facing=back`;
            ninjaUrl += `&videobitrate=${currentQualitySettings.bitrate}&maxfps=${currentQualitySettings.maxfps}`;

            iframe.src = ninjaUrl;
        }

        // ขอสิทธิ์และดึงอุปกรณ์กล้อง/ไมค์ โดยตรงจากเบราว์เซอร์
        async function fetchAvailableDevices() {
            try {
                // ขออนุญาตเพื่ออ่าน label/ชื่อกล้องได้ถูกต้อง
                await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                populateDeviceLists(devices);
            } catch (err) {
                // หากติดข้อจำกัด ให้ส่งคำสั่งผ่าน VDO.Ninja แทน
                sendNinjaCommand({ action: 'getDevices' });
            }
        }

        // รับข้อมูลสถานะกลับมาจาก VDO.Ninja API
        window.addEventListener('message', function(e) {
            if (e.source !== iframe.contentWindow) return;

            try {
                const data = JSON.parse(e.data);

                if (data.action === 'system' && data.value === 'connected') {
                    document.getElementById('status-dot').classList.add('active');
                    document.getElementById('status-text').innerText = 'LIVE ONLINE';

                    fetchAvailableDevices();
                }

                if (data.action === 'deviceList') {
                    populateDeviceLists(data.value);
                }
            } catch (err) {
                // Ignore non-JSON
            }
        });

        function sendNinjaCommand(cmdObject) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify(cmdObject), '*');
            }
        }

        // === ฟังก์ชันสลับโหมดการเชื่อมต่อ (Connection Mode) ===

        function changeConnectionMode(modeKey) {
            const bitrateSelect = document.getElementById('bitrate-select');

            if (modeKey === 'custom') return;

            const settings = getQualitySettings(modeKey);
            currentQualitySettings = settings;

            // อัปเดต UI ข้อความและพารามิเตอร์
            document.getElementById('bitrate-slider').value = settings.bitrate;
            updateBitrateSliderLabel(settings.bitrate);
            document.getElementById('fps-select').value = settings.maxfps.toString();
            bitrateSelect.value = 'auto';

            // ส่งคำสั่งปรับการตั้งค่าไปยัง VDO.Ninja Engine แบบ Real-time
            sendNinjaCommand({ action: 'bitrate', value: settings.bitrate });
            sendNinjaCommand({ action: 'framerate', value: settings.maxfps });

            const [w, h] = settings.res.split('x');
            sendNinjaCommand({ action: 'resolution', width: parseInt(w), height: parseInt(h) });
        }

        // === ฟังก์ชันปุ่มควบคุมหลัก ===

        function toggleCamera() {
            sendNinjaCommand({ action: 'changeVideoTarget' });
        }

        function toggleMute() {
            isMuted = !isMuted;
            sendNinjaCommand({ action: 'mute', value: isMuted });

            const btn = document.getElementById('mute-btn');
            btn.innerText = isMuted ? '🔇' : '🎙️';
            btn.classList.toggle('active-state', isMuted);
        }

        function toggleTorch() {
            isTorchOn = !isTorchOn;
            sendNinjaCommand({ action: 'torch', value: isTorchOn });

            const btn = document.getElementById('torch-btn');
            btn.classList.toggle('active-state', isTorchOn);
        }

        function toggleMirror() {
            isMirrored = !isMirrored;
            sendNinjaCommand({ action: 'mirror', value: isMirrored });

            const btn = document.getElementById('mirror-btn');
            btn.classList.toggle('active-state', isMirrored);
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                fetchAvailableDevices();
            }
        }

        // === ฟังก์ชันจัดการ BITRATE ===

        function changeBitratePreset(val) {
            let targetBitrate = currentQualitySettings.bitrate;

            if (val === 'auto') {
                targetBitrate = currentQualitySettings.bitrate;
            } else if (val !== 'custom') {
                targetBitrate = parseInt(val);
                document.getElementById('connection-mode-select').value = 'custom';
            }

            document.getElementById('bitrate-slider').value = targetBitrate;
            updateBitrateSliderLabel(targetBitrate);

            sendNinjaCommand({ action: 'bitrate', value: targetBitrate });
        }

        function updateBitrateSliderLabel(val) {
            document.getElementById('bitrate-val').innerText = `${parseInt(val).toLocaleString()} k`;
        }

        function changeBitrateValue(val) {
            document.getElementById('bitrate-select').value = 'custom';
            document.getElementById('connection-mode-select').value = 'custom';
            sendNinjaCommand({ action: 'bitrate', value: parseInt(val) });
        }

        // === ฟังก์ชันการตั้งค่ากล้องเชิงลึก (Settings) ===

        function populateDeviceLists(devices) {
            const cameraSelect = document.getElementById('camera-select');
            const micSelect = document.getElementById('mic-select');

            cameraSelect.innerHTML = '';
            micSelect.innerHTML = '';

            let camIndex = 1;
            let micIndex = 1;

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                if (device.kind === 'videoinput') {
                    let labelName = device.label || `กล้องตัวที่ ${camIndex++}`;
                    option.text = labelName;
                    cameraSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    let labelName = device.label || `ไมโครโฟน ${micIndex++}`;
                    option.text = labelName;
                    micSelect.appendChild(option);
                }
            });
        }

        function changeVideoDevice(deviceId) {
            if (deviceId) {
                // สลับไปยังกล้องเฉพาะตาม ID
                sendNinjaCommand({ action: 'changeVideoTarget', value: deviceId });
            }
        }

        function changeAudioDevice(deviceId) {
            if (deviceId) {
                sendNinjaCommand({ action: 'changeAudioTarget', value: deviceId });
            }
        }

        function changeResolution(res) {
            if (res === 'default') return;
            document.getElementById('connection-mode-select').value = 'custom';
            const [w, h] = res.split('x');
            sendNinjaCommand({ action: 'resolution', width: parseInt(w), height: parseInt(h) });
        }

        function changeFPS(fps) {
            document.getElementById('connection-mode-select').value = 'custom';
            sendNinjaCommand({ action: 'framerate', value: parseInt(fps) });
        }

        function changeZoom(val) {
            document.getElementById('main-zoom-val').innerText = `${val}x`;
            sendNinjaCommand({ action: 'zoom', value: parseFloat(val) });
        }

        window.onload = () => {
            initNinja();
        };
    </script>
</body>
</html>
