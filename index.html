<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS Ninja Mobile Camera Sender</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        #error-container {
            padding: 20px;
            max-width: 300px;
            display: none;
        }
        h2 {
            color: #ff4f4f;
            font-size: 18px;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            color: #adadb8;
            line-height: 1.5;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="error-container">
        <h2>❌ ไม่พบ Stream ID</h2>
        <p>กรุณาสแกน QR Code ใหม่จากหน้าจอควบคุมหลัก (Controller) เพื่อเปิดใช้งานกล้อง</p>
    </div>

    <iframe id="push-iframe" allow="autoplay; camera; microphone; fullscreen; display-capture"></iframe>

    <script>
        // ดึงค่า ?push=... จาก URL ที่มือถือสแกนเข้ามา
        const urlParams = new URLSearchParams(window.location.search);
        const pushId = urlParams.get('push');

        if (pushId) {
            // สร้างลิงก์ส่งสัญญาณภาพของ VDO.Ninja (โหมด Push พร้อมตั้งค่าความคมชัดและการใช้งานมือถือ)
            const vdoNinjaPushUrl = `https://vdo.ninja/?push=${pushId}&camera=1&autostart&quality=1&scale=100&bitrate=2500`;
            document.getElementById('push-iframe').src = vdoNinjaPushUrl;
        } else {
            // หากไม่มีพารามิเตอร์ push ให้ซ่อน iframe แล้วแสดงข้อความแจ้งเตือน
            document.getElementById('push-iframe').style.display = 'none';
            document.getElementById('error-container').style.display = 'block';
        }
    </script>
</body>
</html>
