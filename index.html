<!DOCTYPE html>

<html lang="th">
<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

<title>VDO.Ninja Camera Receiver</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

:root{

    --accent:#3b82f6;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#f59e0b;

    --bg:#050505;

    --panel:rgba(20,21,27,.94);

    --border:
        rgba(255,255,255,.13);

}

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    user-select:none;
    -webkit-user-select:none;

}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

}

body{

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =====================================================
   MAIN
===================================================== */

.app{

    position:relative;

    width:100vw;
    height:100vh;

    background:#000;

    overflow:hidden;

}


/* =====================================================
   VDO FRAME
===================================================== */

#vdo-frame{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    background:#000;

    z-index:1;

}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{

    position:absolute;

    top:15px;
    left:15px;
    right:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    z-index:20;

    transition:
        opacity .4s ease;

}

.top-left{

    display:flex;

    align-items:center;

    gap:9px;

    padding:
        8px 13px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:22px;

    backdrop-filter:
        blur(12px);

}

.live-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:
        var(--red);

}

.live-dot.connected{

    background:
        var(--green);

    animation:
        blink 1.4s infinite;

}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.3;
    }

}

.status-text{

    font-size:.72rem;

    font-weight:600;

}

.stream-name{

    color:
        rgba(255,255,255,.55);

    font-size:.68rem;

}


/* =====================================================
   CONTROL BAR
===================================================== */

.controls{

    position:absolute;

    right:16px;

    top:50%;

    transform:
        translateY(-50%);

    z-index:30;

    display:flex;

    flex-direction:column;

    gap:10px;

    padding:11px 9px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:25px;

    backdrop-filter:
        blur(14px);

    transition:
        opacity .4s ease;

}

.control-btn{

    width:44px;
    height:44px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.07);

    color:#fff;

    display:flex;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.2s;

}

.control-btn:hover{

    background:
        rgba(255,255,255,.15);

}

.control-btn:active{

    transform:
        scale(.9);

}

.control-btn.active{

    background:
        var(--accent);

    border-color:
        var(--accent);

}


/* =====================================================
   CONNECT PANEL
===================================================== */

.connect-panel{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:
        min(92%,430px);

    background:
        rgba(15,16,21,.97);

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:22px;

    padding:22px;

    z-index:100;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);

}

.connect-panel.hidden{

    display:none;

}

.panel-header{

    display:flex;

    align-items:center;

    gap:11px;

    margin-bottom:18px;

}

.logo{

    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(59,130,246,.15);

    color:
        var(--accent);

}

.panel-title{

    font-size:1rem;

    font-weight:700;

}

.panel-subtitle{

    margin-top:3px;

    font-size:.68rem;

    color:
        rgba(255,255,255,.5);

}

.input-label{

    display:block;

    font-size:.72rem;

    color:
        rgba(255,255,255,.7);

    margin-bottom:7px;

}

.stream-input{

    width:100%;

    height:46px;

    padding:
        0 13px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.06);

    color:#fff;

    outline:none;

    font-size:.82rem;

}

.stream-input:focus{

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(59,130,246,.12);

}

.connect-btn{

    width:100%;

    height:46px;

    margin-top:12px;

    border:0;

    border-radius:12px;

    background:
        var(--accent);

    color:#fff;

    font-size:.82rem;

    font-weight:600;

    cursor:pointer;

}

.connect-btn:active{

    transform:
        scale(.98);

}

.example{

    margin-top:12px;

    padding:10px;

    border-radius:10px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.5);

    font-size:.65rem;

    line-height:1.5;

}


/* =====================================================
   SETTINGS PANEL
===================================================== */

.settings-panel{

    position:absolute;

    right:75px;

    top:50%;

    transform:
        translateY(-50%);

    width:220px;

    padding:15px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:17px;

    z-index:50;

    display:none;

}

.settings-panel.show{

    display:block;

}

.settings-title{

    font-size:.78rem;

    font-weight:600;

    margin-bottom:10px;

}

.settings-select{

    width:100%;

    height:40px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.07);

    color:#fff;

    padding:0 10px;

    outline:none;

}

.settings-select option{

    background:#15161b;

    color:#fff;

}


/* =====================================================
   BOTTOM INFO
===================================================== */

.bottom-info{

    position:absolute;

    bottom:15px;

    left:15px;

    z-index:20;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        7px 12px;

    background:
        var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:18px;

    font-size:.65rem;

    backdrop-filter:
        blur(10px);

}

.connection-indicator{

    width:7px;
    height:7px;

    border-radius:50%;

    background:
        var(--red);

}

.connection-indicator.online{

    background:
        var(--green);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    position:absolute;

    inset:0;

    background:
        rgba(0,0,0,.45);

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:12px;

}

.loading.show{

    display:flex;

}

.spinner{

    width:36px;
    height:36px;

    border:
        3px solid
        rgba(255,255,255,.18);

    border-top-color:
        #fff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loading-text{

    font-size:.75rem;

    color:
        rgba(255,255,255,.8);

}


/* =====================================================
   HIDDEN UI
===================================================== */

.ui-hidden{

    opacity:0 !important;

    pointer-events:none !important;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .top-bar{

        top:9px;
        left:9px;
        right:9px;

    }

    .controls{

        right:9px;

        gap:8px;

        padding:
            9px 8px;

    }

    .control-btn{

        width:42px;
        height:42px;

    }

    .settings-panel{

        right:68px;

        width:190px;

    }

    .bottom-info{

        bottom:9px;
        left:9px;

    }

}

</style>

</div>

<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentStreamID =
    localStorage.getItem(
        "vdo_stream_id"
    ) || "";

let isMuted = true;

let uiTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const frame =
    document.getElementById(
        "vdo-frame"
    );

const connectPanel =
    document.getElementById(
        "connect-panel"
    );

const streamInput =
    document.getElementById(
        "stream-input"
    );

const statusText =
    document.getElementById(
        "status-text"
    );

const streamName =
    document.getElementById(
        "stream-name"
    );

const liveDot =
    document.getElementById(
        "live-dot"
    );

const connectionIndicator =
    document.getElementById(
        "connection-indicator"
    );

const connectionText =
    document.getElementById(
        "connection-text"
    );

const loading =
    document.getElementById(
        "loading"
    );

const settingsPanel =
    document.getElementById(
        "settings-panel"
    );

const qualitySelect =
    document.getElementById(
        "quality-select"
    );


/* =====================================================
   BUILD VDO URL
===================================================== */

function buildVDOURL(
    streamID
){

    const bitrate =
        qualitySelect.value;


    return (
        "https://vdo.ninja/?" +
        "view=" +
        encodeURIComponent(
            streamID
        ) +
        "&autoplay" +
        "&cleanoutput" +
        "&videobitrate=" +
        bitrate
    );

}


/* =====================================================
   CONNECT STREAM
===================================================== */

function connectStream(
    streamID
){

    streamID =
        streamID.trim();


    if(!streamID){

        alert(
            "กรุณาใส่ Stream ID"
        );

        return;
    }


    /* Remove accidental URL */

    if(
        streamID.includes(
            "vdo.ninja"
        )
    ){

        try{

            const url =
                new URL(
                    streamID
                );


            const id =
                url.searchParams.get(
                    "view"
                ) ||
                url.searchParams.get(
                    "v"
                ) ||
                url.searchParams.get(
                    "streamid"
                );


            if(id){

                streamID = id;

            }

        }

        catch(e){

            console.log(
                "Invalid URL"
            );

        }

    }


    currentStreamID =
        streamID;


    localStorage.setItem(
        "vdo_stream_id",
        streamID
    );


    streamInput.value =
        streamID;


    showLoading(
        "กำลังเชื่อมต่อกล้อง..."
    );


    updateStatus(
        "CONNECTING",
        false
    );


    frame.src =
        buildVDOURL(
            streamID
        );


    setTimeout(
        function(){

            hideLoading();

        },

        1500
    );


    connectPanel
        .classList
        .add("hidden");

}


/* =====================================================
   STOP STREAM
===================================================== */

function stopStream(){

    frame.src =
        "about:blank";


    updateStatus(
        "DISCONNECTED",
        false
    );


    connectionText.textContent =
        "หยุด Stream";


    connectionIndicator
        .classList
        .remove("online");


    liveDot
        .classList
        .remove("connected");

}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateStatus(
    status,
    connected
){

    statusText.textContent =
        status;


    streamName.textContent =
        currentStreamID
            ? "| " +
              currentStreamID
            : "";


    if(connected){

        liveDot
            .classList
            .add("connected");

        connectionIndicator
            .classList
            .add("online");

        connectionText.textContent =
            "Connected";

    }

    else{

        liveDot
            .classList
            .remove("connected");

    }

}


/* =====================================================
   CONNECT BUTTON
===================================================== */

document
    .getElementById(
        "connect-btn"
    )
    .onclick =
    function(){

        connectStream(
            streamInput.value
        );

    };


/* =====================================================
   OPEN CONNECT PANEL
===================================================== */

document
    .getElementById(
        "btn-connect"
    )
    .onclick =
    function(){

        connectPanel
            .classList
            .remove("hidden");


        streamInput.focus();

    };


/* =====================================================
   ENTER KEY
===================================================== */

streamInput
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key ===
                "Enter"
            ){

                connectStream(
                    streamInput.value
                );

            }

        }
    );


/* =====================================================
   MUTE
===================================================== */

document
    .getElementById(
        "btn-mute"
    )
    .onclick =
    function(){

        isMuted =
            !isMuted;


        /*
         * VDO.Ninja iframe is cross-origin.
         * We use postMessage to request
         * mute/unmute where supported.
         */

        frame.contentWindow
            ?.postMessage(
                {
                    mute:
                        isMuted
                },
                "*"
            );


        this.classList.toggle(
            "active",
            !isMuted
        );


        const icon =
            document.getElementById(
                "mute-icon"
            );


        if(isMuted){

            icon.setAttribute(
                "data-lucide",
                "volume-x"
            );

        }

        else{

            icon.setAttribute(
                "data-lucide",
                "volume-2"
            );

        }


        lucide.createIcons();

    };


/* =====================================================
   FULLSCREEN
===================================================== */

document
    .getElementById(
        "btn-fullscreen"
    )
    .onclick =
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .getElementById(
                        "app"
                    )
                    .requestFullscreen();

            }

            else{

                await document
                    .exitFullscreen();

            }

        }

        catch(err){

            console.log(
                "Fullscreen error:",
                err
            );

        }

    };


/* =====================================================
   SETTINGS
===================================================== */

document
    .getElementById(
        "btn-settings"
    )
    .onclick =
    function(){

        settingsPanel
            .classList
            .toggle("show");

    };


/* =====================================================
   QUALITY CHANGE
===================================================== */

qualitySelect.onchange =
function(){

    if(
        currentStreamID
    ){

        frame.src =
            buildVDOURL(
                currentStreamID
            );

    }

};


/* =====================================================
   STOP
===================================================== */

document
    .getElementById(
        "btn-stop"
    )
    .onclick =
    function(){

        stopStream();

    };


/* =====================================================
   VDO.NINJA MESSAGE
===================================================== */

window.addEventListener(
    "message",
    function(event){

        if(
            !event.data
        ){
            return;
        }


        const data =
            event.data;


        console.log(
            "VDO.Ninja:",
            data
        );


        /*
         * VDO.Ninja may send
         * connection/state messages.
         */

        if(
            data.action ===
            "view-connection"
        ){

            if(
                data.value === true
            ){

                updateStatus(
                    "LIVE",
                    true
                );

            }

            else{

                updateStatus(
                    "DISCONNECTED",
                    false
                );

            }

        }


        if(
            data.action ===
            "push-connection"
        ){

            if(
                data.value === true
            ){

                updateStatus(
                    "LIVE",
                    true
                );

            }

        }

    }
);


/* =====================================================
   IFRAME LOAD
===================================================== */

frame.addEventListener(
    "load",
    function(){

        if(
            currentStreamID
        ){

            updateStatus(
                "CONNECTED",
                true
            );

            hideLoading();

        }

    }
);


/* =====================================================
   LOADING
===================================================== */

function showLoading(
    text
){

    document
        .getElementById(
            "loading-text"
        )
        .textContent =
        text;


    loading
        .classList
        .add("show");

}


function hideLoading(){

    loading
        .classList
        .remove("show");

}


/* =====================================================
   AUTO HIDE
===================================================== */

function resetUI(){

    document
        .getElementById(
            "top-bar"
        )
        .classList
        .remove("ui-hidden");


    document
        .getElementById(
            "controls"
        )
        .classList
        .remove("ui-hidden");


    clearTimeout(
        uiTimer
    );


    uiTimer =
        setTimeout(
            function(){

                document
                    .getElementById(
                        "top-bar"
                    )
                    .classList
                    .add("ui-hidden");


                document
                    .getElementById(
                        "controls"
                    )
                    .classList
                    .add("ui-hidden");


                settingsPanel
                    .classList
                    .remove("show");

            },

            5000
        );

}


document
    .getElementById(
        "app"
    )
    .addEventListener(
        "mousemove",
        resetUI
    );


document
    .getElementById(
        "app"
    )
    .addEventListener(
        "touchstart",
        resetUI,
        {
            passive:true
        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

streamInput.value =
    currentStreamID;


lucide.createIcons();


/*
 * ถ้ามี Stream ID ที่เคยใช้
 * ให้เปิดอัตโนมัติ
 */

if(
    currentStreamID
){

    setTimeout(
        function(){

            connectStream(
                currentStreamID
            );

        },

        500
    );

}

else{

    connectPanel
        .classList
        .remove("hidden");

}


resetUI();

</script>
